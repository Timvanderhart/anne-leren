// ---------- KLEUR ----------
{t:"kleur",k:"Charles Blanc",q:"Welke kleur is volgens de kleurencirkel van Charles Blanc complementair aan blauw?",fig:{svg:"blanc"},o:["Oranje","Geel","Groen","Violet"],a:0,
e:"Bij Blanc staan blauw en oranje tegenover elkaar. De andere paren zijn rood-groen en geel-violet.",
x:["","Geel is complementair aan blauw in de kleurencirkel van licht, niet bij Blanc. Bij Blanc hoort geel bij violet.","Groen hoort bij rood.","Violet hoort bij geel."]},
{t:"kleur",k:"Kleurencirkel licht",q:"Welke kleur is in de kleurencirkel van licht complementair aan groen?",fig:{svg:"lichtcirkel"},o:["Magenta","Rood","Cyaan","Geel"],a:0,
e:"In de kleurencirkel van licht staat magenta tegenover groen. Groen licht + magenta licht (rood + blauw) = wit.",
x:["","Rood-groen is het paar bij Charles Blanc (verf).","Cyaan staat tegenover rood.","Geel staat tegenover blauw."]},
{t:"kleur",k:"Additief",q:"Op een beeldscherm worden rood en groen licht gemengd. Welke kleur zie je?",o:["Geel","Bruin","Wit","Cyaan"],a:0,
e:"Licht mengen is additief: rood + groen licht = geel. De mengkleur is lichter dan de bronkleuren.",
x:["","Bruin krijg je eerder bij het mengen van verf; licht wordt bij mengen juist lichter.","Wit krijg je pas met rood, groen én blauw.","Cyaan is groen + blauw licht."]},
{t:"kleur",k:"Subtractief",q:"Van Gogh mengt blauwe en gele verf. Welke kleur krijgt hij?",o:["Groen","Wit","Grijs","Oranje"],a:0,
e:"Verf mengen is subtractief. Blauw + geel = groen (secundaire kleur in de cirkel van Blanc).",
x:["","Wit ontstaat bij het optellen van licht, niet bij verf.","Grijs krijg je bij het mengen van complementaire verfkleuren, zoals blauw en oranje.","Oranje is geel + rood."]},
{t:"kleur",k:"Subtractief",q:"Wat geldt altijd voor een mengkleur van verf?",o:["Hij is donkerder dan de donkerste bronkleur","Hij is lichter dan de lichtste bronkleur","Hij is even licht als het gemiddelde van de bronkleuren","Hij is altijd grijs"],a:0,
e:"Bij verf onttrekt elke kleur licht (absorptie). Er wordt steeds minder licht teruggekaatst, dus de mengkleur is donkerder dan de donkerste bronkleur.",
x:["","Dit geldt voor licht (additief), niet voor verf.","De module zegt duidelijk: donkerder dan de donkerste bronkleur.","Alleen bij complementaire verfkleuren wordt het grijsachtig."]},
{t:"kleur",k:"Nabeeld",q:"Je staart 20 seconden naar de rode muts van de zoeaaf en kijkt dan naar een wit vel. Welke kleur heeft het nabeeld?",fig:{img:"zoeaaf",arrow:[25,14]},o:["Groen","Rood","Blauw","Zwart"],a:0,
e:"Rood en groen zitten in hetzelfde opponente kanaal. Door het staren raakt de rode kant uitgeput. Wit stimuleert alles, dus de groene kant wint: je ziet groen.",
x:["","Het nabeeld heeft juist de tegenkleur, niet dezelfde kleur.","Blauw zit in het geel-blauwkanaal, niet in het rood-groenkanaal.","Een zwart nabeeld krijg je na staren naar wit."]},
{t:"kleur",k:"Simultaancontrast",q:"In een oranjegeel korenveld zet een schilder grijze schaduwstreepjes. Hoe zie je die?",o:["Blauwviolet, door simultaancontrast","Oranje, omdat de omgeving oranje is","Gewoon grijs, want grijs heeft geen kleur","Groen, door een nabeeld"],a:0,
e:"Door simultaancontrast zie je de grijze streepjes in de complementaire kleur van de omgeving: blauwviolet bij oranjegeel.",
x:["","Door het contrast lijkt het juist de tegenkleur, niet dezelfde kleur.","De module noemt dit voorbeeld juist: het neutrale grijs wordt als blauwviolet gezien.","Een nabeeld ontstaat na staren; hier gaat het om kleuren die tegelijk naast elkaar staan."]},
{t:"kleur",k:"Eigenschappen",q:"Fel rood en lichtroze hebben dezelfde tint. Lichtroze bevat meer wit. In welke eigenschap verschillen ze vooral?",o:["Verzadiging","Tint","Contrast","Simultaancontrast"],a:0,
e:"Verzadiging beschrijft de puurheid van de kleur: hoe weinig wit erin zit. Lichtroze is minder verzadigd dan fel rood.",
x:["","De tint (de kleurnaam) is volgens de vraag hetzelfde.","Contrast is het verschil tussen lichte en donkere delen naast elkaar.","Simultaancontrast is een waarnemingseffect door omringende kleuren."]},
{t:"kleur",k:"Opponente kanalen",q:"Waarom kun je wel ‘roodachtig blauw’ zien, maar niet ‘geelachtig blauw’?",o:["Geel en blauw zitten in hetzelfde opponente kanaal","Er bestaan geen kegeltjes voor geel","Blauw licht heeft te weinig energie","Geel en blauw zijn allebei primaire verfkleuren"],a:0,
e:"De signalen gaan via drie kanalen met tegengestelde processen: rood-groen, geel-blauw en zwart-wit. Binnen één kanaal zie je het een of het ander.",
x:["","Er zijn inderdaad geen gele kegeltjes, maar geel zie je via rood + groen. Dat verklaart niet waarom geel en blauw elkaar uitsluiten.","Blauw licht heeft juist meer energie dan geel licht.","Rood is ook een primaire verfkleur, en roodachtig blauw kun je wel zien."]},
{t:"kleur",k:"Van Gogh",q:"In Het nachtcafé zette Van Gogh felrode muren naast een groen plafond en een groene biljarttafel. Wat wilde hij daarmee bereiken?",fig:{img:"nachtcafe"},o:["Complementaire kleuren versterken elkaar door simultaancontrast","Rood en groen mengen in je oog tot geel","Rood en groen licht samen geven wit","Het rode geraniumlak verbleekt minder naast groen"],a:0,
e:"Rood en groen zijn complementair. Naast elkaar versterken ze elkaar: de kleuren worden feller en het beeld krijgt meer spanning.",
x:["","Mengen in je oog gebeurt bij kleine stipjes (pointillisme), niet bij grote vlakken.","Rood + groen licht geeft geel, niet wit. En Van Gogh werkte met verf: het gaat om het complementaire contrast.","Verbleken heeft met licht en pigment te maken, niet met de buurkleur."]},

// ---------- VERF ----------
{t:"verf",k:"Opbouw verf",q:"Waaruit bestaat verf?",o:["Pigment (of kleurstof), bindmiddel en eventueel een oplosmiddel","Alleen pigment en water","Kleurstof en vernis","Pigment, emulgator en zuurstof"],a:0,
e:"Verf is een mengsel van een pigment (soms een kleurstof) met een bindmiddel en eventueel een oplosmiddel om te verdunnen.",
x:["","Pigment wordt pas verf met een bindmiddel. Water is bij olieverf geen onderdeel.","Vernis is een beschermlaag over de verf, geen onderdeel van verf.","Een emulgator zit alleen in emulsieverf zoals tempera; zuurstof is nodig bij het drogen."]},
{t:"verf",k:"Kleurstof en pigment",q:"Wat is het belangrijkste verschil tussen een kleurstof en een pigment?",o:["Een kleurstof lost op, een pigment niet","Een pigment is altijd organisch, een kleurstof niet","Een kleurstof is altijd lichtecht, een pigment niet","Een pigment heeft geen bindmiddel nodig"],a:0,
e:"Kleurstoffen lossen op (in water) en hechten aan het materiaal. Pigmenten zijn onoplosbare korrels die een bindmiddel nodig hebben.",
x:["","Het is eerder andersom: kleurstoffen zijn meestal organisch; pigmenten kunnen organisch of anorganisch zijn.","Kleurstoffen zijn juist slecht tot matig lichtecht.","Een pigment wordt pas verf met een bindmiddel."]},
{t:"verf",k:"Lakpigment",q:"Hoe maak je van de oplosbare kleurstof eosine een pigment (geraniumlak)?",o:["Je laat de kleurstof adsorberen aan een onoplosbare witte vaste stof uit aluin en KOH","Je laat de kleurstof verdampen tot een poeder","Je lost de kleurstof op in lijnolie","Je verhit de kleurstof tot hij oxideert"],a:0,
e:"Bij een lakpigment hecht (adsorbeert) de kleurstof aan een onoplosbare witte stof. Die maak je meestal uit een aluminiumzout (aluin) en kaliloog (KOH). Het gekleurde product lost niet meer op.",
x:["","Indampen geeft een kleurstofpoeder dat nog steeds oplost; dat is geen pigment.","Een pigment moet juist níet oplossen in de olie (anders bloedt het).","Verhitten verandert of beschadigt de kleurstof; zo maak je geen lakpigment."]},
{t:"verf",k:"Eigenschappen",q:"Een rood pigment lost een beetje op in lijnolie. Wat kan er gebeuren?",o:["Het schilderij gaat ‘bloeden’: de kleur trekt in andere verflagen","Het pigment wordt lichtechter","De verf droogt sneller","De verf wordt doorzichtig en kleurloos"],a:0,
e:"Als een pigment oplost in olie, lost het ook op in de olie van de lagen erboven en eronder. Dan krijg je ongewenste kleurmengingen: bloeden. Vooral organische pigmenten doen dit.",
x:["","Oplosbaarheid zegt niets over lichtechtheid.","Het droogproces wordt hier niet sneller door.","Het pigment blijft gekleurd; het verspreidt zich alleen."]},
{t:"verf",k:"Fysisch drogen",q:"Bij het drogen van olieverf vindt een fysisch proces plaats. Welk?",o:["Het oplosmiddel verdampt","De dubbele bindingen reageren met zuurstof","De pigmentkorrels lossen op","Het bindmiddel polymeriseert"],a:0,
e:"Fysisch drogen: het oplosmiddel (bijv. terpentijn) verdampt. Pigment en bindmiddel komen dichter bij elkaar en trekken elkaar aan door vanderwaalskrachten.",
x:["","Reageren met zuurstof is een chemisch proces.","Pigmentkorrels lossen niet op; dat is juist een eis aan een pigment.","Polymerisatie is het chemische droogproces."]},
{t:"verf",k:"Chemisch drogen",q:"Hoe heet het proces waardoor de pigmentkorrels bij het chemisch drogen onlosmakelijk worden ingesloten?",o:["Polymerisatie (vernetting)","Verdamping","Emulgeren","Denatureren"],a:0,
e:"Zuurstof vormt bruggen tussen de vetzuurketens. Zo ontstaat een netwerk (polymeer) waarin de pigmentkorrels vastzitten: polymerisatie of vernetting.",
x:["","Verdamping van het oplosmiddel is het fysische droogproces.","Emulgeren is het mengen van water en olie met een emulgator (tempera).","Denatureren van eiwitten gebeurt bij het drogen van tempera, niet van olieverf."]},
{t:"verf",k:"Chemisch drogen",q:"Welk gas wordt verbruikt bij het chemisch drogen van olieverf?",o:["Zuurstof","Koolstofdioxide","Stikstof","Waterdamp"],a:0,
e:"De dubbele bindingen in de onverzadigde vetzuren reageren met zuurstof uit de lucht.",
x:["","Koolstofdioxide speelt geen rol bij het drogen van olieverf.","Stikstof reageert niet.","Waterdamp is geen reactant; bij tempera verdampt juist water."]},
{t:"verf",k:"Onverzadigde vetzuren",q:"Hieronder staan twee vetzuren uit olie. Welk vetzuur kan meedoen aan het chemisch drogen?",fig:{mols:[["linolzuur","Linolzuur"],["stearinezuur","Stearinezuur"]]},o:["Linolzuur, want het heeft dubbele bindingen (C=C) in de keten","Stearinezuur, want het heeft een langere keten","Allebei evenveel, want beide hebben een zuurgroep","Geen van beide, want drogen is alleen verdampen"],a:0,
e:"Bij het chemisch drogen reageren de C=C-bindingen met zuurstof. Linolzuur is onverzadigd (twee C=C), stearinezuur is verzadigd (geen C=C).",
x:["","Stearinezuur heeft geen dubbele bindingen in de keten; de lengte doet hier niet toe.","De zuurgroep (-COOH) is niet wat met zuurstof reageert; het gaat om de C=C-bindingen.","Naast verdampen (fysisch) is er ook chemisch drogen."]},
{t:"verf",k:"Licht en drogen",q:"Waarom is (UV-)licht nodig bij het chemisch drogen van olieverf?",o:["UV-licht levert de energie om de reactie met zuurstof te laten verlopen","UV-licht laat het oplosmiddel verdampen","UV-licht maakt de pigmentkorrels kleiner","UV-licht maakt de olie dunner"],a:0,
e:"Voor de oxidatie van de dubbele bindingen is energie nodig om de reactie op gang te brengen. Die energie komt uit het ultraviolette deel van het licht.",
x:["","Verdampen is fysisch drogen en hangt vooral af van temperatuur, niet van UV.","De korrelgrootte verandert niet door licht.","Licht maakt olie niet dunner."]},
{t:"verf",k:"Vet over mager",q:"Waarom moet je bij olieverf ‘vet over mager’ schilderen?",o:["Vette verf droogt langzamer; magere verf erop zou scheuren","Magere verf heeft meer pigment en dekt beter","Vette verf hecht niet aan het doek","Magere verf droogt alleen chemisch"],a:0,
e:"Vette verf (met lijnolie) droogt langzaam en blijft lang bewegen. Een snelle, magere laag (met terpentijn) daarbovenop scheurt dan.",
x:["","Het gaat om de droogtijd, niet om de hoeveelheid pigment.","Vette verf hecht prima.","Magere verf droogt juist sneller door verdamping (fysisch)."]},
{t:"verf",k:"Emulsie",q:"Waarom heeft ei-tempera wel een emulgator nodig en olieverf niet?",o:["In tempera moeten water en olie/vet gemengd worden; in olieverf zit geen water","Olieverf droogt sneller","In olieverf zit al lecithine","Tempera bevat geen bindmiddel"],a:0,
e:"Een emulgator is nodig om twee vloeistoffen te mengen die niet in elkaar oplossen. Tempera bevat water en vet (eigeel). Olieverf bevat alleen olie (en terpentijn, dat met olie mengt).",
x:["","De droogtijd heeft niets met emulgeren te maken; olieverf droogt juist langzaam.","Lecithine zit in eigeel, niet in olieverf.","Eigeel is juist het bindmiddel van tempera."]},
{t:"verf",k:"Bindmiddelen",q:"Welk bindmiddel hoort bij aquarel?",o:["Arabische gom","Eigeel","Lijnolie","Synthetisch polymeer"],a:0,
e:"Aquarel gebruikt Arabische gom. Tempera: eigeel. Olieverf: lijnolie. Acryl: synthetisch polymeer.",
x:["","Eigeel hoort bij tempera.","Lijnolie hoort bij olieverf.","Een synthetisch polymeer hoort bij acryl."]},
{t:"verf",k:"Pigmenten",q:"Loodwit wordt zwart in een ruimte met waterstofsulfide (H₂S). Over welke eigenschap van pigmenten gaat dit?",o:["Chemische reactiviteit (inertheid)","Lichtechtheid","Dekkend vermogen","Grootte van de korrels"],a:0,
e:"Het pigment reageert met een stof uit de lucht: lood + H₂S geeft zwart loodsulfide (PbS). Dat is chemische reactiviteit.",
x:["","Lichtechtheid gaat over verandering door licht.","Dekkend vermogen gaat over doorzichtigheid.","Korrelgrootte gaat over verstrooiing en verdeling in het bindmiddel."]},
{t:"verf",k:"Bindmiddel",q:"Een verf bevat te weinig olie. Wat gebeurt er na het drogen?",o:["De verflaag wordt poederig en laat los","De verf gaat bloeden","De verf vergeelt sterk","De verf droogt nooit"],a:0,
e:"Het bindmiddel plakt de korrels aan elkaar en aan de drager. Met te weinig olie kleven niet alle korrels: de laag verpoedert en laat los.",
x:["","Bloeden komt door een pigment dat oplost in de olie.","Vergelen komt juist door de olie zelf (oxidatie).","Ook met weinig olie droogt verf."]},

{t:"verf",k:"Lakpigment",q:"Bij het maken van geraniumlak voeg je kaliloog toe aan een aluinoplossing. Welk wit neerslag ontstaat?",o:["Al(OH)₃","KOH","K₂SO₄","Eosine"],a:0,
e:"De aluminiumionen uit aluin reageren met de hydroxide-ionen uit kaliloog: Al³⁺ + 3 OH⁻ → Al(OH)₃. Aan dit onoplosbare witte neerslag hecht de eosine.",
x:["","KOH is juist de oplossing die je toevoegt; die lost goed op.","Kaliumsulfaat lost goed op in water en slaat dus niet neer.","Eosine is de kleurstof, geen wit neerslag."]},
{t:"verf",k:"Practicum",q:"Bij het verkleuringsproefje plak je aluminiumfolie over de helft van de strepen eosine en methyleenblauw. Waarom?",o:["Als controle: zo zie je dat het licht de verkleuring veroorzaakt","Om de kleurstof sneller te laten drogen","Om meer zonlicht op de strepen te laten vallen","Omdat aluminium met eosine reageert"],a:0,
e:"De bedekte helft krijgt geen licht, maar verder alles hetzelfde. Verbleekt alleen de onbedekte helft, dan weet je dat licht de oorzaak is.",
x:["","Drogen is hier niet het doel; het gaat om verbleken in een week.","De folie houdt het licht juist tegen.","Het gaat niet om een reactie met aluminium; de folie schermt alleen af."]},

// ---------- MOLECUUL ----------
{t:"molecuul",k:"Geconjugeerd systeem",q:"Welke van deze drie stoffen is gekleurd? (De andere twee zijn kleurloos.)",fig:{mols:[["hexaan","Hexaan"],["hexatrieen","Hexa-1,3,5-trieen"],["betacaroteen","β-caroteen"]]},o:["β-caroteen","Hexa-1,3,5-trieen","Hexaan","Alle drie"],a:0,
e:"β-caroteen heeft een heel groot geconjugeerd systeem (elf dubbele bindingen om en om met enkele bindingen). Daardoor absorbeert het zichtbaar (blauw) licht en is het oranje. Hexatrieen heeft maar drie geconjugeerde dubbele bindingen en absorbeert alleen UV.",
x:["","Hexatrieen heeft een klein geconjugeerd systeem; de absorptie ligt nog in het UV. Dus kleurloos.","Hexaan heeft geen enkele dubbele binding.","Hexaan en hexatrieen absorberen geen zichtbaar licht."]},
{t:"molecuul",k:"Grootste golflengte",q:"Welke van deze stoffen absorbeert licht met de grootste golflengte?",fig:{mols:[["naftaleen","Naftaleen"],["antraceen","Antraceen"],["tetraceen","Tetraceen"]]},o:["Tetraceen","Antraceen","Naftaleen","Ze absorberen allemaal dezelfde golflengte"],a:0,
e:"Tetraceen heeft het grootste geconjugeerde systeem (vier ringen, de meeste afwisselende enkele en dubbele bindingen). Meer gedelokaliseerde elektronen betekent minder energie nodig om een elektron aan te slaan, dus een grotere golflengte.",
x:["","Antraceen heeft een kleiner geconjugeerd systeem dan tetraceen.","Naftaleen heeft het kleinste systeem en absorbeert de kleinste golflengte (UV).","De grootte van het geconjugeerde systeem verschilt, dus de golflengte ook."]},
{t:"molecuul",k:"Kleinste golflengte",q:"Welke stof absorbeert licht met de kleinste golflengte?",fig:{mols:[["butadieen","Buta-1,3-dieen"],["hexatrieen","Hexa-1,3,5-trieen"],["retinol","Retinol"]]},o:["Buta-1,3-dieen","Hexa-1,3,5-trieen","Retinol","Retinol en butadieen evenveel"],a:0,
e:"Butadieen heeft het kleinste geconjugeerde systeem (twee dubbele bindingen). Er is de meeste energie nodig om een elektron aan te slaan, dus de kleinste golflengte.",
x:["","Hexatrieen heeft drie geconjugeerde dubbele bindingen: grotere golflengte dan butadieen.","Retinol heeft vijf geconjugeerde dubbele bindingen: de grootste golflengte van deze drie.","Het aantal geconjugeerde dubbele bindingen verschilt (2 en 5)."]},
{t:"molecuul",k:"Chromofoor en auxochroom",q:"Bekijk alizarine. Welke groep is een auxochrome groep?",fig:{mols:[["alizarine","Alizarine"]]},o:["De -OH-groep","De >C=O-groep","De C=C-bindingen in de ringen","De benzeenring als geheel"],a:0,

{t:"molecuul",k:"Chromofoor en auxochroom",q:"Welke van deze groepen is een chromofore groep?",o:["-NO₂","-OH","-NH₂","-Br"],a:0,

{t:"molecuul",k:"Waargenomen kleur",q:"Een stof absorbeert vooral blauw licht. Welke kleur heeft de stof?",o:["Geel","Blauw","Groen","Zwart"],a:0,

{t:"molecuul",k:"Waargenomen kleur",q:"Karmijnzuur (cochenille) is rood. Welk licht wordt vooral geabsorbeerd?",fig:{mols:[["karmijnzuur","Karmijnzuur (cochenille)"]]},o:["Groen (blauwgroen) licht","Rood licht","Geel licht","UV-licht"],a:0,

{t:"molecuul",k:"Grafiet en diamant",q:"Waarom is grafiet zwart?",o:["Het heeft extreem veel vrije elektronen en absorbeert alle golflengten","Het heeft geen vrije elektronen","Het kaatst alle golflengten terug","Het absorbeert alleen UV"],a:0,

{t:"molecuul",k:"Gedelokaliseerde elektronen",q:"Wat zijn gedelokaliseerde elektronen?",o:["Elektronen die door het hele geconjugeerde systeem kunnen bewegen","Elektronen die vastzitten bij één atoom","Elektronen in de binnenste schil van een atoom","Elektronen die een ligand aan een metaalion geeft"],a:0,

// ---------- COMPLEX ----------
{t:"complex",k:"Ligand",q:"Waaraan moet een deeltje voldoen om een ligand te kunnen zijn?",o:["Het heeft een vrij elektronenpaar","Het is altijd negatief geladen","Het is een metaalion","Het heeft een dubbele binding"],a:0,
e:"Een ligand levert een vrij elektronenpaar voor de binding met het metaalion (elektronenpaardonor). Ook neutrale moleculen zoals H₂O en NH₃ zijn liganden.",
x:["","H₂O, NH₃ en CO zijn neutraal en toch liganden.","Het metaalion is juist de elektronenpaaracceptor.","Een dubbele binding is niet nodig; H₂O heeft er geen."]},
{t:"complex",k:"Verdringingsreeks",q:"Welk ligand bindt het sterkst aan een metaalion?",o:["CN⁻","H₂O","Cl⁻","NH₃"],a:0,
e:"In de verdringingsreeks staat CN⁻ helemaal rechts (alleen CO staat nog verder). Hoe verder rechts, hoe sterker het ligand.",
x:["","Water staat in het midden van de reeks.","Cl⁻ staat links van water: zwakker.","NH₃ is sterker dan water, maar zwakker dan CN⁻."]},
{t:"complex",k:"Verdringen",q:"Aan een oplossing met ijzer(III)ionen omringd door water voeg je natriumcyanide toe. Wat gebeurt er?",o:["CN⁻ verdringt de watermoleculen, omdat CN⁻ sterker bindt","Water verdringt de CN⁻-ionen","Er gebeurt niets, want Na⁺ is geen ligand","Fe³⁺ wordt Fe²⁺"],a:0,
e:"CN⁻ staat rechts van H₂O in de verdringingsreeks en bindt dus sterker. Het verdringt het water en de kleur van de oplossing verandert.",
x:["","Het sterkste ligand wint; dat is CN⁻, niet water.","Na⁺ doet niet mee, maar CN⁻ wel.","Er verandert geen lading (dat zou redox zijn); het is een ligandverdringing (substitutie)."]},
{t:"complex",k:"Splitsing en golflengte",q:"Een complex krijgt een sterker ligand. Wat gebeurt er met het licht dat geabsorbeerd wordt?",o:["Δ wordt groter: het complex absorbeert licht met een kleinere golflengte","Δ wordt kleiner: het complex absorbeert licht met een kleinere golflengte","Δ wordt groter: het complex absorbeert licht met een grotere golflengte","Er verandert niets aan de absorptie"],a:0,
e:"Sterker ligand = grotere splitsingsenergie Δ. Meer energie hoort bij een kleinere golflengte (E = h·c/λ).",
x:["","Een sterker ligand geeft juist een grotere Δ.","Meer energie betekent een kleinere golflengte, niet een grotere.","Het ligand bepaalt de energieniveaus, dus de absorptie verandert."]},
{t:"complex",k:"Verdringingsreeks",q:"Je wilt dat een complex licht met een grotere golflengte absorbeert dan het complex met water. Welk ligand kies je?",o:["Br⁻","NH₃","CN⁻","CO"],a:0,
e:"Een grotere golflengte = minder energie = kleinere Δ. Daarvoor heb je een zwakker ligand nodig, links van water: bijv. Br⁻ of I⁻.",
x:["","NH₃ is sterker dan water: kleinere golflengte.","CN⁻ is veel sterker: kleinere golflengte.","CO is het sterkste ligand: kleinere golflengte."]},
{t:"complex",k:"Tekenen",q:"Hoe teken je een watermolecuul dat als ligand aan een Fe³⁺-ion vastzit?",o:["Met het O-atoom naar het ion en de H-atomen naar buiten","Met de H-atomen naar het ion","Met één H-atoom en het O-atoom naar het ion","Het maakt niet uit hoe je het tekent"],a:0,
e:"O heeft vrije elektronenparen en een negatieve partiële lading (δ⁻). Die wordt aangetrokken door het positieve ion. Het O-atoom levert het elektronenpaar.",
x:["","H-atomen zijn juist positief (δ⁺) en worden afgestoten door Fe³⁺.","Het elektronenpaar komt van het O-atoom; H doet niet mee aan de binding.","Op de toets kost een verkeerde oriëntatie punten."]},
{t:"complex",k:"Pruisisch blauw",q:"Waardoor wordt de intense kleur van Pruisisch blauw veroorzaakt?",o:["Ladingsoverdracht tussen Fe²⁺ en Fe³⁺","Een groot geconjugeerd systeem van C=C-bindingen","Een complex van kobalt met aluminium en zuurstof","Verdringing van water door chloride"],a:0,
e:"Pruisisch blauw bevat ijzer in twee ladingen (Fe²⁺ en Fe³⁺). Licht laat een elektron overspringen van het ene ion naar het andere: kleur door overdracht van lading (redox).",
x:["","Een geconjugeerd systeem verklaart de kleur van organische pigmenten.","Dat is kobaltblauw (CoAl₂O₄).","Er zitten cyanide-ionen in, geen chloride; en de kleur komt door de twee ladingen."]},
{t:"complex",k:"Complex of redox",q:"Wat is een verschil tussen de vorming van een complex en een redoxreactie?",o:["Bij een complex blijft de lading van het metaal gelijk, bij redox verandert die","Bij een complex worden losse elektronen overgedragen","Bij redox levert een ligand een elektronenpaar","Er is geen verschil"],a:0,
e:"Complexvorming: het ligand deelt een elektronenpaar met het metaalion; de lading van het metaal blijft hetzelfde. Redox: losse elektronen gaan over; de lading verandert.",
x:["","Losse elektronen overdragen is juist redox.","Een elektronenpaar leveren voor een binding hoort bij complexvorming.","De module zet de verschillen in een tabel (figuur 131)."]},
{t:"complex",k:"Ethaan-1,2-diamine",q:"Eén molecuul ethaan-1,2-diamine (EDA) verdringt twee waterliganden. Waarom?",fig:{mols:[["eda","Ethaan-1,2-diamine"]]},o:["Het heeft twee N-atomen met elk een vrij elektronenpaar","Het is twee keer zo zwaar als water","Het heeft twee dubbele bindingen","Het is negatief geladen"],a:0,
e:"EDA heeft twee NH₂-groepen. Elk N-atoom heeft een vrij elektronenpaar, dus één EDA vormt twee bindingen met het metaalion en neemt twee plekken in.",
x:["","Massa bepaalt niet hoeveel bindingen een ligand vormt.","EDA heeft geen dubbele bindingen.","EDA is neutraal."]},
{t:"complex",k:"Overgangsmetalen",q:"Waarom kunnen overgangsmetalen gekleurde complexen vormen?",o:["Ze hebben een gedeeltelijk gevulde d-schil","Ze hebben altijd lading 2+","Ze hebben een groot geconjugeerd systeem","Ze zijn allemaal radioactief"],a:0,
e:"Door de gedeeltelijk gevulde d-schil kunnen ze bindingen vormen met liganden. De liganden splitsen de energieniveaus en daardoor wordt zichtbaar licht geabsorbeerd.",
x:["","Overgangsmetalen hebben juist vaak verschillende ladingen.","Een geconjugeerd systeem hoort bij organische moleculen.","De meeste overgangsmetalen zijn niet radioactief, en radioactiviteit heeft niets met kleur te maken."]},

// ---------- VERKLEURING ----------
{t:"verkleuring",k:"De slaapkamer",q:"Van Gogh schreef dat de muren van De slaapkamer bleek violet waren. Nu zijn ze blauw. Hoe komt dat?",fig:{imgs:[["slaapkamer-nu","Nu"],["slaapkamer-reconstructie","Digitale reconstructie"]]},o:["Het rode geraniumlak in het violet is door licht verbleekt; het blauw bleef over","Het blauwe pigment is donkerder geworden door zwavel","De vernis is vergeeld","Van Gogh heeft het later overgeschilderd"],a:0,
e:"Het violet was een mengsel van blauw (Pruisisch blauw, kobaltblauw), wit en rood geraniumlak (eosine). Geraniumlak is niet lichtecht; het rood verdween en alleen blauw bleef over.",
x:["","Zwavel laat vooral loodpigmenten zwart worden, niet blauw.","Vergeelde vernis maakt alles geler/groener, niet blauwer.","Uit onderzoek blijkt verkleuring; onder het oppervlak zit nog rood pigment."]},
{t:"verkleuring",k:"Zonnebloemen",q:"Waardoor worden de gele zonnebloemen langzaam bruin?",o:["Chroomgeel (Cr⁶⁺) wordt onder UV omgezet in Cr³⁺ (groen) en het lood vormt zwart PbO₂","Het geraniumlak verbleekt","Het bindmiddel verdampt","Het chroomgeel lost op in de olie"],a:0,
e:"Onder UV-straling degradeert Cr⁶⁺ in PbCrO₄ naar Cr³⁺. Er ontstaat een dun groen laagje Cr₂O₃·2H₂O en zwart PbO₂. Samen met het geel geeft dat de indruk van bruin.",
x:["","Geraniumlak speelt bij De slaapkamer, niet bij het geel van de zonnebloemen.","Lijnolie verdampt niet; het droogt chemisch.","Dan zou het bloeden, niet bruin worden."]},
{t:"verkleuring",k:"Redox",q:"Welke halfreactie hoort bij de verandering van chroomgeel?",o:["Cr⁶⁺ + 3 e⁻ → Cr³⁺","Cr⁶⁺ → Cr³⁺ + 3 e⁻","Cr³⁺ + 3 e⁻ → Cr⁶⁺","Cr⁶⁺ + 3 e⁻ → Cr⁹⁺"],a:0,
e:"Van 6+ naar 3+ betekent dat de lading 3 lager wordt: er komen 3 elektronen bij. Elektronen staan dus links.",
x:["","Hier staan de elektronen aan de verkeerde kant; dan zou de lading omhoog moeten gaan.","Dit is de omgekeerde reactie: van Cr³⁺ naar Cr⁶⁺ moet je juist elektronen afstaan.","Elektronen opnemen maakt de lading lager, niet hoger."]},
{t:"verkleuring",k:"Redox",q:"Is Cr⁶⁺ in de reactie Cr⁶⁺ + 3 e⁻ → Cr³⁺ een oxidator of een reductor?",o:["Een oxidator, want het neemt elektronen op","Een reductor, want het neemt elektronen op","Een oxidator, want het staat elektronen af","Een reductor, want de lading daalt"],a:0,
e:"Een oxidator neemt elektronen op (elektronacceptor). Cr⁶⁺ neemt 3 elektronen op, dus Cr⁶⁺ is de oxidator; zelf wordt het gereduceerd.",
x:["","Een reductor staat juist elektronen af.","Cr⁶⁺ staat geen elektronen af, het neemt ze op.","Een dalende lading betekent elektronen opnemen; dat doet een oxidator."]},
{t:"verkleuring",k:"Vernis",q:"Een blauwe verf wordt bedekt met vernis die vergeelt. Welke kleur zie je dan ongeveer?",o:["Groenig: het gele vernis absorbeert een deel van het blauwe licht","Nog steeds hetzelfde blauw","Paars","Wit"],a:0,
e:"Vergeelde vernis absorbeert blauw licht. Het blauw van de verf wordt dus deels weggenomen; geel over blauw werkt als subtractief mengen en geeft een groenige, doffere kleur.",
x:["","De vernis is niet meer kleurloos; het absorbeert nu blauw licht.","Paars krijg je met rood en blauw, niet met geel en blauw.","Een extra laag die licht absorbeert maakt het nooit witter."]},
{t:"verkleuring",k:"Restauratie",q:"Waarom moet alles wat een restaurator doet weer ongedaan gemaakt kunnen worden?",o:["Het schilderij is uniek; later zijn er misschien betere technieken of nieuwe inzichten","Omdat restauratie anders te duur wordt","Omdat de verf anders niet droogt","Omdat het museum het schilderij anders niet mag lenen"],a:0,
e:"Een schilderij kun je niet vervangen. Een ingreep mag het origineel dus niet blijvend veranderen; dan kan het later beter worden gedaan.",
x:["","De kosten zijn niet de reden die de module noemt.","Dit heeft niets met drogen te maken.","Uitlenen speelt hier geen rol."]},
{t:"verkleuring",k:"Gassen",q:"Welk effect hebben gassen zoals NH₃, SOₓ en NOₓ op een schilderij?",o:["Ze zorgen voor verzuring, waardoor de structuur van de verf uiteenvalt","Ze laten de vernis glanzen","Ze versnellen het drogen van de olie","Ze maken pigmenten lichtecht"],a:0,
e:"Deze gassen komen via ventilatie, apparatuur of schoonmaakmiddelen het museum binnen. In de verf veroorzaken ze verzuringsreacties: de verf en de kleur vallen uiteen.",
x:["","Ze tasten de vernis juist aan.","Drogen gaat met zuurstof en UV.","Ze maken pigmenten juist minder stabiel."]},
{t:"verkleuring",k:"Hitte",q:"Waarom verkleurt gele oker naar rood of bruin bij hitte?",o:["Alle waterliganden verdwijnen","Het lood reageert met zwavel","De vernis oxideert","Het geconjugeerde systeem wordt groter"],a:0,
e:"Volgens de module verkleurt gele oker doordat bij hitte alle waterliganden verdwijnen. Andere liganden betekent een andere kleur.",
x:["","Lood en zwavel geven zwart; oker is een ijzeroxide.","Vernis vergeelt, maar verklaart de kleur van oker niet.","Oker is anorganisch; een geconjugeerd systeem speelt geen rol."]},
{t:"verkleuring",k:"Licht",q:"Waarom kan UV-straling een pigment laten verbleken, maar zichtbaar licht veel minder?",o:["UV heeft een kleinere golflengte en dus meer energie, genoeg om bindingen te verbreken","UV heeft een grotere golflengte en dus meer energie","UV wordt niet geabsorbeerd","Zichtbaar licht bevat geen fotonen"],a:0,
e:"Hoe kleiner de golflengte, hoe meer energie per foton (E = h·c/λ). UV-fotonen hebben genoeg energie om chemische bindingen te verbreken.",
x:["","Een grotere golflengte betekent juist minder energie.","UV wordt wel geabsorbeerd; daardoor kan het schade doen.","Alle licht bestaat uit fotonen."]},

m:"Eosine. Eosine heeft het grootste geconjugeerde systeem (drie ringen, de C=O- en NO₂-groepen, en nog een extra ring) en daarmee de meeste gedelokaliseerde elektronen. Er is dan minder energie nodig om een elektron aan te slaan, dus het absorbeert licht met de grootste golflengte.\n\nLet op: dit is de redenering met de regel uit de module. In werkelijkheid absorbeert indigo (blauw) bij een grotere golflengte (oranje licht, ca. 600 nm) dan eosine (rood, absorbeert groen, ca. 520 nm). De regel is een vuistregel. Vraag je docent welke redenering hij of zij bij deze vraag verwacht."}]},

{id:"s1-2",src:"Oefentoets set 1",model:"eigen",title:"Opgave 2: olieverf drogen",t:["verf"],
intro:"Bij het drogen van olieverf vindt een fysisch en een chemisch proces plaats.",

parts:[
{l:"2a",p:1,q:"Omschrijf met twee tot vier woorden het fysisch proces.",c:[{p:1,t:"(Het) verdampen van het oplosmiddel."}],m:"Verdampen van het oplosmiddel."},
{l:"2b",p:1,q:"Benoem het proces waardoor bij het chemisch proces de pigmentkorrels onlosmakelijk ingesloten worden.",c:[{p:1,t:"Polymerisatie (vernetting)."}],m:"Polymerisatie (vernetting): zuurstof vormt bruggen tussen de vetzuurketens en de pigmentkorrels zitten vast in het netwerk."},
{l:"2c",p:1,q:"Noem het gas dat hierbij verbruikt wordt.",c:[{p:1,t:"Zuurstof (O₂)."}],m:"Zuurstof."}]},

{id:"s1-3",src:"Oefentoets set 1",model:"eigen",title:"Opgave 3: de stoel en je hersenen",t:["oog"],
fig:{img:"stoel"},
intro:"Je kijkt naar het schilderij ‘De stoel van Vincent’ (hierboven).",
note:"Er was geen antwoordmodel bij deze vraag; dit model hebben we zelf opgesteld op basis van paragraaf 4.2. De verdeling van de punten is onze inschatting.",
parts:[
{l:"3a",p:3,q:"In jouw hersenen wordt er een beeld gevormd van bovenstaand schilderij. Waar in je hersenen wordt het linkerdeel van dit schilderij afgebeeld? Leg uit. Ga er daarbij vanuit dat deze zenuwbanen kruisen.",
c:[{p:1,t:"In de rechterhersenhelft (achterin, in het gezichtscentrum)."},{p:1,t:"De ooglens keert het beeld om: het linkerdeel van het schilderij valt op de rechterhelft van het netvlies (bij het linkeroog is dat de neuskant)."},{p:1,t:"De zenuwbanen van de neuskant kruisen in het chiasma opticum naar de andere kant, dus naar de rechterhersenhelft. (Die van de slaapkant van het rechteroog gaan ook naar rechts.)"}],
m:"In de rechterhersenhelft. De ooglens keert het beeld om, waardoor het linkerdeel van het schilderij op de rechterhelft van het netvlies valt. Bij het linkeroog is dat de neuskant; die zenuwbanen kruisen in het chiasma opticum en gaan naar de rechterhersenhelft. Bij het rechteroog is het de slaapkant; die zenuwbanen kruisen niet en gaan ook naar rechts. Het linkerdeel komt dus uit beide ogen in de rechterhersenhelft aan."},
{l:"3b",p:1,q:"Kruisen alle zenuwbanen van het oog naar de hersenen?",c:[{p:1,t:"Nee: alleen de zenuwbanen van de neuskant van het netvlies kruisen; die van de slaapkant niet."}],m:"Nee. Alleen de zenuwbanen van de neuskant van het netvlies kruisen in het chiasma opticum. De zenuwbanen van de slaapkant blijven aan dezelfde kant."}]},

{id:"s1-4",src:"Oefentoets set 1",model:"eigen",title:"Opgave 4: kegeltjes bij de stoel",t:["netvlies"],
fig:{img:"stoel",arrow:[64,23],cones:true},
intro:"De blauwe pijl wijst naar de muur achter de stoel. Die is heel licht blauwgroen, bijna wit. Hiernaast staat het diagram met de gevoeligheid van de drie soorten kegeltjes.",
note:"Er was geen antwoordmodel bij deze vraag; dit model hebben we zelf opgesteld. De muur is heel licht blauwgroen. Welke golflengte je kiest mag een beetje verschillen (wij rekenen 460 tot 530 nm goed); het gaat erom dat je aflezing klopt bij jouw golflengte. Omdat de kleur bijna wit is, zijn alle drie de kegeltjes vrij sterk actief.",
parts:[{l:"4",p:4,q:"Je kijkt naar de plek die de blauwe pijl aangeeft. Welke soorten kegeltjes zijn actief? Geef in het tabelletje ook aan voor welk percentage ze actief zijn. Leg uit waar je het diagram daartoe hebt afgelezen.",
fields:[{f:"cones",color:"lichtblauw"},{f:"text",ph:"Leg uit hoe je het hebt afgelezen..."}],
c:[{p:1,t:"Golflengte past bij licht blauwgroen (ongeveer 460-530 nm).",auto:"lambda"},{p:1,t:"Juiste kegeltjes genoemd bij jouw golflengte (bij 490 nm alle drie).",auto:"cones-types"},{p:1,t:"Percentages kloppen bij jouw golflengte (marge 8%).",auto:"cones-pct"},{p:1,t:"Uitleg: bij de golflengte van lichtblauw een verticale lijn getrokken en afgelezen waar die de drie curves snijdt."}],
m:"Licht blauwgroen ligt rond 490 nm. Trek bij 490 nm een verticale lijn in het diagram en lees af waar die de curves snijdt: blauw (S) ongeveer 57%, groen (M) ongeveer 64%, rood (L) ongeveer 16%. Alle drie de kegeltjes zijn dus actief, blauw en groen het sterkst. (Kies je 470 nm, dan: blauw ±80%, groen ±37%, rood 0%. Kies je 510 nm, dan: blauw ±29%, groen ±88%, rood ±44%.)"}]},

{id:"m-hiroshige",src:"Module opdracht 4",model:"eigen",title:"Kegeltjes bij de Bloeiende pruimenboomgaard",t:["netvlies"],

{l:"b",p:2,q:"De rode lucht.",fields:[{f:"cones",color:"rood"}],c:[{p:1,t:"Golflengte past bij rood (ongeveer 620-750 nm).",auto:"lambda"},{p:1,t:"Percentages kloppen bij jouw golflengte (marge 8%).",auto:"cones-pct"}],m:"Bij 650 nm: rood ongeveer 23%, groen 0%, blauw 0%."},
{l:"c",p:2,q:"De blauwe bomen.",fields:[{f:"cones",color:"blauw"}],c:[{p:1,t:"Golflengte past bij blauw (ongeveer 440-495 nm).",auto:"lambda"},{p:1,t:"Percentages kloppen bij jouw golflengte (marge 8%).",auto:"cones-pct"}],m:"Bij 470 nm: blauw ongeveer 80%, groen ongeveer 37%, rood 0%."},
{l:"d",p:2,q:"De gele lucht.",fields:[{f:"cones",color:"geel"}],c:[{p:1,t:"Golflengte past bij geel (ongeveer 560-595 nm).",auto:"lambda"},{p:1,t:"Percentages kloppen bij jouw golflengte (marge 8%).",auto:"cones-pct"}],m:"Bij 580 nm: rood ongeveer 100%, groen ongeveer 40%, blauw 0%."},
{l:"e",p:1,q:"Bij welke kleuren in het schilderij zijn meerdere kegeltjes actief?",c:[{p:1,t:"Bij oranje, blauw en geel; bij (diep)rood alleen het rode kegeltje."}],m:"Bij de oranje lijst, de blauwe bomen en de gele lucht zijn steeds twee soorten kegeltjes actief. Bij de (diep)rode lucht vanaf ongeveer 640 nm alleen het rode kegeltje."}]},

{id:"s2-1",src:"Oefenvragen set 2",model:"docent+",title:"IJzer(III)ionen en liganden",t:["complex","licht"],
intro:"De kleur van metaalionen hangt niet alleen af van het metaalion, maar ook van het ligand dat eraan gebonden is. Als er verschillende liganden beschikbaar zijn, zal het ligand dat het sterkst bindt het metaalion omringen en de andere liganden verdringen.\n\nDe verdringingsreeks van liganden:\nI⁻ < Br⁻ < S²⁻ < SCN⁻ < Cl⁻ < NO₃⁻ < F⁻ < OH⁻ < H₂O < NH₃ < ethaan-1,2-diamine < NO₂⁻ < CN⁻ < CO\nI⁻ is dus het zwakst bindende ligand en CO het sterkste.\n\nIJzer(III)ionen kunnen verschillende kleuren geven, afhankelijk van het ligand waarmee ze omringd zijn.",
note:"Antwoordmodel van je docent, met verbeteringen: de rekenfout bij c is verbeterd. De puntentelling is onze inschatting.",
parts:[
{l:"a",p:2,q:"Teken een ijzer(III)ion dat omringd is door 4 watermoleculen. (Teken op papier en vergelijk daarna met het model.)",
c:[{p:1,t:"De O-atomen van de watermoleculen wijzen naar het Fe³⁺-ion."},{p:1,t:"Vier watermoleculen rondom het ion, met de H-atomen naar buiten."}],
m:"Fe³⁺ in het midden, met vier watermoleculen eromheen. Elk watermolecuul wijst met het O-atoom (vrije elektronenparen, δ⁻) naar het positieve ion; de H-atomen wijzen naar buiten.",mfig:{svg:"fewater"}},
{l:"b",p:1,q:"Welke kleur zal een oplossing van ijzer(III)nitraat hebben? (Maak gebruik van tabel 65B van Binas.)",c:[{p:1,t:"Lichtgeel."}],m:"Lichtgeel. NO₃⁻ is een zwakker ligand dan water, dus het Fe³⁺-ion is omringd door water."},
{l:"c",p:3,q:"Bereken de energie van het licht dat overeenkomt met deze kleur.",
fields:[{f:"num",label:"Energie",sci:true,unit:"J",range:[4.0e-19,4.45e-19]},{f:"text",ph:"Je berekening..."}],
c:[{p:1,t:"Golflengte van het geabsorbeerde licht gekozen: blauw (450-490 nm), want de oplossing is geel."},{p:1,t:"f = c / λ, bijv. 3,0 · 10⁸ / 480 · 10⁻⁹ = 6,25 · 10¹⁴ Hz."},{p:1,t:"E = h · f = 6,626 · 10⁻³⁴ × 6,25 · 10¹⁴ = 4,14 · 10⁻¹⁹ J (tussen 4,0 en 4,4 · 10⁻¹⁹ J is goed).",auto:"num"}],
note:"Let op: de vraag zegt ‘het licht dat overeenkomt met deze kleur’. Het model van je docent bedoelt het geabsorbeerde (complementaire, blauwe) licht. Reken je met geel licht (ca. 580 nm, ongeveer 3,4 · 10⁻¹⁹ J), vraag dan je docent of dat ook goed is.",
m:"De oplossing is geel, dus blauw licht (450-490 nm) wordt geabsorbeerd. Het model gebruikt 480 nm.\nf = c / λ = 3,0 · 10⁸ / 480 · 10⁻⁹ = 6,25 · 10¹⁴ Hz\nE = h · f = 6,626 · 10⁻³⁴ × 6,25 · 10¹⁴ = 4,14 · 10⁻¹⁹ J\n(In het model van je docent staat 6,25 · 10⁻¹⁴; dat moet 6,25 · 10¹⁴ zijn.)"},
{l:"d",p:2,q:"Leg uit hoe het komt dat de kleur van de oplossing verandert als een (kleurloze) oplossing van natriumcyanide wordt toegevoegd aan de oplossing van ijzer(III)nitraat.",
c:[{p:1,t:"Natriumcyanide bevat CN⁻-ionen; CN⁻ is een sterker ligand dan water (staat rechts van water in de reeks)."},{p:1,t:"CN⁻ verdringt de watermoleculen; Fe³⁺ wordt nu omringd door CN⁻, waardoor de oplossing een andere kleur krijgt."}],
m:"Een oplossing van natriumcyanide bevat CN⁻-ionen. CN⁻ is een sterker ligand dan water. De ijzer(III)ionen worden nu omringd door CN⁻-ionen in plaats van watermoleculen, waardoor de oplossing een andere kleur krijgt."},
{l:"e",p:2,q:"Leg uit welke kleur deze oplossing nu zal krijgen. (Maak gebruik van tabel 65B van Binas.)",
c:[{p:1,t:"Het ijzer(III)ion wordt omringd door zes CN⁻-ionen: [Fe(CN)₆]³⁻."},{p:1,t:"De kleur die in Binas tabel 65B bij [Fe(CN)₆]³⁻ staat (volgens het model van je docent: rood)."}],
m:"Uit tabel 65B blijkt dat het ijzer(III)ion omringd wordt door zes CN⁻-ionen: [Fe(CN)₆]³⁻. Volgens het antwoordmodel van je docent geeft dit de oplossing een rode kleur.\n\nLet op: dat konden wij niet controleren. In werkelijkheid is een oplossing van [Fe(CN)₆]³⁻ geel; alleen het vaste zout (‘rood bloedloogzout’) is rood. Kijk wat er in jouw Binas staat."},
{l:"f",p:1,q:"Welk ligand had gebruikt kunnen worden om naar de andere kant van het kleurenspectrum te gaan?",
c:[{p:1,t:"Een ligand links van water in de verdringingsreeks, bijvoorbeeld I⁻ of Br⁻."}],
m:"Een ligand dat links van water staat in de verdringingsreeks, bijvoorbeeld het jodide-ion of het bromide-ion. Zo'n zwakker ligand geeft een kleinere splitsingsenergie, dus absorptie bij een grotere golflengte."}]},

{id:"s2-2",src:"Oefenvragen set 2",model:"docent+",title:"Het droogproces van olieverf",t:["verf"],
intro:"Olieverf droogt door middel van twee processen: een fysisch droogproces en een chemisch droogproces.",
note:"Antwoordmodel van je docent, met verbeteringen bij b en c (zie Leerpunten). De puntentelling is onze inschatting.",
parts:[
{l:"a",p:2,q:"Leg uit wat er gebeurt bij het fysische droogproces.",
c:[{p:1,t:"Het oplosmiddel verdampt uit de verf."},{p:1,t:"Pigment en bindmiddel komen dichter bij elkaar en binden sterker door vanderwaalskrachten (er ontstaat een harde film)."}],
m:"Het oplosmiddel verdampt uit de verf. Het pigment en het bindmiddel komen steeds dichter bij elkaar te liggen, waardoor ze sterker met elkaar binden: de vanderwaalsbinding wordt sterker."},
{l:"b",p:2,q:"Leg uit waarom bij het chemische droogproces onverzadigde vetzuren nodig zijn.",
c:[{p:1,t:"Onverzadigde vetzuren hebben dubbele bindingen (C=C); die reageren met zuurstof."},{p:1,t:"Zo ontstaan (zuurstof)bruggen tussen de ketens: vernetting. Verzadigde vetzuren kunnen dat niet."}],
m:"De onverzadigde vetzuurketens in de triglyceriden van de olie (het bindmiddel) bevatten dubbele bindingen. Het zijn die dubbele bindingen die onder invloed van UV-licht met zuurstof reageren, zodat er bruggen tussen de ketens ontstaan. Verzadigde vetzuren hebben geen dubbele bindingen en kunnen dit niet."},
{l:"c",p:1,q:"Leg uit waarom bij het chemische droogproces licht nodig is.",
c:[{p:1,t:"Het (UV-)licht levert de energie die nodig is om de reactie met zuurstof te laten verlopen."}],
m:"Het UV-licht levert de energie die nodig is om de reactie met zuurstof op gang te brengen. (In het model van je docent staat ‘endotherme reactie’; dat klopt niet, want de oxidatie van olie is exotherm. Het licht levert de energie om de reactie te starten.)"},
{l:"d",p:1,q:"Welk gas is nodig bij het chemische droogproces?",c:[{p:1,t:"Zuurstof."}],m:"Zuurstof."},
{l:"e",p:2,q:"Leg uit hoe het komt dat de pigmentdeeltjes nog meer ingesloten worden door het bindmiddel tijdens het chemische droogproces.",
c:[{p:1,t:"Door de reactie van de vetzuurketens met zuurstof ontstaan polymeren (een netwerk van hele grote moleculen)."},{p:1,t:"De pigmentdeeltjes worden in dat netwerk ingesloten."}],
m:"Door de reactie tussen de vetzuurketens en zuurstof ontstaan polymeren (hele grote moleculen, een netwerk), waar de pigmentdeeltjes door ingesloten worden."}]},

{id:"n-koper",src:"Nieuw",model:"eigen",title:"Kopersulfaat en ammonia",t:["complex","licht"],
intro:"In bijlage 1 van de module voeg je ammonia toe aan een lichtblauwe oplossing van kopersulfaat. De oplossing wordt donkerblauw. Neem aan dat het koper(II)ion eerst omringd is door vier watermoleculen en daarna door vier NH₃-moleculen.",
parts:[
{l:"a",p:1,q:"Geef de formule van het complexe ion van koper(II) met vier watermoleculen.",c:[{p:1,t:"[Cu(H₂O)₄]²⁺ (met rechte haken en lading 2+)."}],m:"[Cu(H₂O)₄]²⁺"},
{l:"b",p:2,q:"Leg uit waarom de kleur verandert als je ammonia toevoegt.",
c:[{p:1,t:"NH₃ staat rechts van H₂O in de verdringingsreeks: het is een sterker ligand en verdringt het water."},{p:1,t:"Er ontstaat een ander complex ([Cu(NH₃)₄]²⁺) met een andere splitsingsenergie, dus een ander geabsorbeerd licht en een andere kleur."}],
m:"NH₃ is een sterker ligand dan water (staat rechts van water in de verdringingsreeks). Het verdringt de watermoleculen: er ontstaat [Cu(NH₃)₄]²⁺. Dit complex heeft een andere splitsingsenergie Δ, absorbeert dus ander licht en heeft een andere kleur."},
{l:"c",p:2,q:"[Cu(NH₃)₄]²⁺ absorbeert vooral licht van 600 nm. Bereken de energie van één foton van dit licht.",
fields:[{f:"num",label:"Energie",sci:true,unit:"J",ans:3.31e-19,tol:0.03},{f:"text",ph:"Je berekening..."}],
c:[{p:1,t:"f = c / λ = 3,00 · 10⁸ / 6,00 · 10⁻⁷ = 5,00 · 10¹⁴ Hz."},{p:1,t:"E = h · f = 3,31 · 10⁻¹⁹ J.",auto:"num"}],
m:"f = c / λ = 3,00 · 10⁸ / 6,00 · 10⁻⁷ = 5,00 · 10¹⁴ Hz\nE = h · f = 6,626 · 10⁻³⁴ × 5,00 · 10¹⁴ = 3,31 · 10⁻¹⁹ J"},
{l:"d",p:2,q:"Leg uit of [Cu(H₂O)₄]²⁺ licht met een grotere of een kleinere golflengte absorbeert dan [Cu(NH₃)₄]²⁺.",
c:[{p:1,t:"Water is een zwakker ligand dan NH₃, dus de splitsingsenergie Δ is kleiner."},{p:1,t:"Minder energie hoort bij een grotere golflengte: [Cu(H₂O)₄]²⁺ absorbeert bij een grotere golflengte."}],
m:"Een grotere golflengte. Water is een zwakker ligand dan NH₃, dus de splitsingsenergie is kleiner. Een kleinere energie hoort bij een grotere golflengte (E = h·c/λ)."}]},

{id:"n-nikkel",src:"Nieuw",model:"eigen",title:"Nikkel en ethaan-1,2-diamine",t:["complex"],
fig:{mols:[["eda","Ethaan-1,2-diamine (EDA)"]]},
intro:"In bijlage 1 van de module (experiment 67) voeg je steeds meer ethaan-1,2-diamine (EDA) toe aan een groene oplossing van nikkel(II)sulfaat. Het nikkel(II)ion is in water omringd door zes watermoleculen. De kleur verandert via blauw naar paars.",
parts:[
{l:"a",p:1,q:"Geef de formule van het complexe ion hexaaquanikkel(II).",c:[{p:1,t:"[Ni(H₂O)₆]²⁺"}],m:"[Ni(H₂O)₆]²⁺"},
{l:"b",p:1,q:"Leg uit waarom EDA de watermoleculen kan verdringen.",c:[{p:1,t:"EDA staat rechts van water in de verdringingsreeks: het bindt sterker."}],m:"EDA is een sterker ligand dan water (staat er rechts van in de verdringingsreeks) en verdringt het water dus."},
{l:"c",p:2,q:"Eén molecuul EDA verdringt twee watermoleculen. Leg uit hoe dat kan.",
c:[{p:1,t:"EDA heeft twee N-atomen met elk een vrij elektronenpaar."},{p:1,t:"Daarmee vormt één EDA-molecuul twee bindingen met het nikkelion en neemt het de plek van twee watermoleculen in."}],
m:"Een EDA-molecuul heeft twee NH₂-groepen. Elk N-atoom heeft een vrij elektronenpaar. Eén EDA-molecuul kan dus twee bindingen met het nikkelion vormen en neemt twee plekken in."},
{l:"d",p:2,q:"Leg uit wat er met de splitsingsenergie en de geabsorbeerde golflengte gebeurt als EDA het water verdringt.",
c:[{p:1,t:"Sterker ligand: de splitsingsenergie Δ wordt groter."},{p:1,t:"Er wordt licht met meer energie, dus een kleinere golflengte geabsorbeerd (daardoor verandert de kleur)."}],
m:"EDA is een sterker ligand, dus de splitsingsenergie wordt groter. Het complex absorbeert licht met meer energie, dus met een kleinere golflengte. Daardoor verandert de kleur."}]},

{id:"n-slaapkamer",src:"Nieuw",model:"eigen",title:"De slaapkamer verkleurt",t:["verkleuring"],
fig:{imgs:[["slaapkamer-nu","De slaapkamer nu"],["slaapkamer-reconstructie","Digitale reconstructie"]],quote:"‘…De muren zijn van een bleek violet. Op de vloer liggen rode plavuizen. Het hout van het bed en de stoelen zijn geel als verse boter. (…) De deuren lila….’",qsrc:"Van Gogh in een brief aan Theo over De slaapkamer (uit de module, paragraaf 5.3)"},
intro:"Links zie je De slaapkamer zoals het schilderij er nu uitziet, rechts een digitale reconstructie van de oorspronkelijke kleuren.",
parts:[
{l:"a",p:2,q:"Noem twee onderdelen waarvan de kleur nu duidelijk anders is dan Van Gogh in zijn brief beschreef.",
c:[{p:1,t:"Eerste onderdeel goed, bijv. de muren (bleek violet → nu blauw)."},{p:1,t:"Tweede onderdeel goed, bijv. de vloer (rode plavuizen → minder rood) of de deuren (lila → blauwer)."}],
m:"Bijvoorbeeld de muren: bleek violet, nu blauw. En de vloer: rode plavuizen, nu veel minder rood. (Ook goed: de deuren, lila maar nu blauwer.)"},
{l:"b",p:3,q:"Leg uit waarom de muren nu blauw zijn.",
c:[{p:1,t:"Het violet was een mengsel van blauw pigment (Pruisisch blauw, kobaltblauw) en het rode geraniumlak."},{p:1,t:"Geraniumlak is niet lichtecht: het verbleekt onder invloed van (UV-)licht."},{p:1,t:"Het rood is verdwenen; alleen het blauw is overgebleven."}],
m:"Van Gogh mengde het violet van blauw pigment (Pruisisch blauw en kobaltblauw), wit en rood geraniumlak (eosine). Geraniumlak is niet lichtecht en is door het licht verbleekt. Het rood is verdwenen en het blauw is overgebleven."},
{l:"c",p:2,q:"Leg uit waarom UV-straling een pigment kan laten verbleken.",
c:[{p:1,t:"UV-straling heeft veel energie en kan chemische bindingen in het pigment verbreken."},{p:1,t:"Het molecuul verandert (valt uiteen) en absorbeert daardoor ander licht of geen zichtbaar licht meer."}],
m:"UV-straling heeft een kleine golflengte en dus veel energie, genoeg om chemische bindingen in het pigment te verbreken. De moleculen veranderen en kunnen daardoor geen (of ander) zichtbaar licht meer absorberen: de kleur verbleekt."},
{l:"d",p:2,q:"Noem twee maatregelen die een museum kan nemen om verdere verkleuring te voorkomen.",
c:[{p:1,t:"Eerste maatregel, bijv. weinig licht / UV-filters."},{p:1,t:"Tweede maatregel, bijv. gefilterde lucht zonder schadelijke gassen, constante temperatuur en vochtigheid, schoonhouden."}],
m:"Bijvoorbeeld: gedimd licht en UV-filters gebruiken; de lucht filteren zodat er geen gassen als NH₃, SOₓ en NOₓ binnenkomen; temperatuur en luchtvochtigheid constant houden; het schilderij schoon houden."},
{l:"e",p:1,q:"Waarom moet alles wat een restaurator doet weer ongedaan gemaakt kunnen worden?",
c:[{p:1,t:"Het schilderij is uniek; een ingreep mag het origineel niet blijvend veranderen (later kan het misschien beter)."}],
m:"Het schilderij is uniek en kan niet vervangen worden. Als later betere technieken of nieuwe inzichten komen, moet je de ingreep kunnen terugdraaien zonder schade."}]},

{id:"n-zonnebloemen",src:"Nieuw",model:"eigen",title:"Verwelkende zonnebloemen",t:["verkleuring","complex"],
fig:{img:"zonnebloemen"},
intro:"Van Gogh schilderde de Zonnebloemen met het pigment chroomgeel, PbCrO₄. Onder invloed van UV-straling worden de gele bloemen langzaam bruiner.",
parts:[
{l:"a",p:2,q:"Laat met een berekening zien dat chroom in PbCrO₄ de lading 6+ heeft. Lood heeft hier de lading 2+ en zuurstof 2−.",
c:[{p:1,t:"Lading van Pb en O samen: +2 + 4 × (−2) = −6."},{p:1,t:"De stof is neutraal, dus chroom heeft de lading 6+."}],
m:"Pb: +2. Vier O-atomen: 4 × (−2) = −8. Samen −6. De verbinding is neutraal, dus chroom is +6."},
{l:"b",p:2,q:"Geef de halfreactie van Cr⁶⁺ naar Cr³⁺.",
c:[{p:1,t:"Cr⁶⁺ links en Cr³⁺ rechts."},{p:1,t:"3 e⁻ aan de linkerkant: Cr⁶⁺ + 3 e⁻ → Cr³⁺."}],
m:"Cr⁶⁺ + 3 e⁻ → Cr³⁺"},
{l:"c",p:1,q:"Is Cr⁶⁺ in deze halfreactie een oxidator of een reductor? Leg uit.",c:[{p:1,t:"Oxidator, want Cr⁶⁺ neemt elektronen op."}],m:"Een oxidator: Cr⁶⁺ neemt elektronen op."},
{l:"d",p:2,q:"Leg uit waarom de zonnebloemen er bruin uitzien.",
c:[{p:1,t:"Aan het oppervlak ontstaat een dun groen laagje Cr₂O₃·2H₂O (viridiaangroen, Cr³⁺); het lood vormt zwart PbO₂."},{p:1,t:"Geel, groen en zwart samen geven de indruk van bruin."}],
m:"Aan het oppervlak van het chroomgeel ontstaat een dun groen laagje Cr₂O₃·2H₂O (Cr³⁺). Het lood vormt zwart lood(IV)oxide, PbO₂. Al die kleuren samen met het geel geven de indruk van bruin."}]},

{id:"n-vernis",src:"Nieuw",model:"eigen",title:"Vergeelde vernis",t:["molecuul","verkleuring"],
intro:"Over een schilderij wordt een laag vernis aangebracht. Vernis bestaat uit hars, opgelost in een oplosmiddel. Na veel jaren is de vernis geel geworden.",
parts:[
{l:"a",p:2,q:"Leg uit waarom verse vernis kleurloos is.",
c:[{p:1,t:"De moleculen in vernis hebben (weinig) dubbele bindingen die alleen UV-straling absorberen."},{p:1,t:"UV is onzichtbaar; zichtbaar licht wordt niet geabsorbeerd, dus de vernis is kleurloos."}],
m:"De organische moleculen in de vernis absorberen alleen UV-straling. UV is voor ons onzichtbaar en zichtbaar licht wordt doorgelaten, dus de vernis is kleurloos."},
{l:"b",p:3,q:"Leg uit waarom de vernis door oxidatie geel wordt.",
c:[{p:1,t:"Door oxidatie ontstaan meer dubbele bindingen: een groter geconjugeerd systeem met meer vrije elektronen."},{p:1,t:"Er is minder energie nodig om een elektron aan te slaan; de absorptie verschuift van UV naar blauw."},{p:1,t:"Blauw wordt geabsorbeerd, groen en rood worden teruggekaatst: samen zie je geel."}],
m:"Door het oxideren ontstaan meer dubbele bindingen, dus meer vrije elektronen. Daardoor is minder energie nodig om een elektron aan te slaan en verschuift de absorptie van het UV-gebied naar het blauwe gebied. Groen en rood licht worden teruggekaatst en dat zie je als geel."},
{l:"c",p:2,q:"Onder de vergeelde vernis zit een blauwe verflaag. Leg uit welke kleur je nu ongeveer ziet.",
c:[{p:1,t:"De gele vernis absorbeert een deel van het blauwe licht van de verf."},{p:1,t:"Je ziet een groenige (en doffere/donkerdere) kleur: geel over blauw werkt als subtractief mengen."}],
m:"De gele vernis absorbeert blauw licht, dus een deel van het blauw van de verf wordt weggenomen. Geel over blauw werkt als subtractief mengen: je ziet een groenige, doffere kleur."}]},

{id:"n-kleuren",src:"Nieuw",model:"eigen",title:"Kleurcontrasten bij Van Gogh",t:["kleur"],
fig:{imgs:[["cafeterras","Caféterras bij nacht"],["nachtcafe","Het nachtcafé"]]},
intro:"Van Gogh gebruikte de kleurencirkel van Charles Blanc. In de Caféterras bij nacht zette hij een geel en oranje terras tegen een donkerblauwe lucht. In Het nachtcafé schilderde hij rode muren boven een groene biljarttafel.",
parts:[
{l:"a",p:3,q:"Noem de drie complementaire kleurenparen uit de kleurencirkel van Charles Blanc.",
c:[{p:1,t:"Rood en groen."},{p:1,t:"Geel en violet (paars)."},{p:1,t:"Blauw en oranje."}],m:"Rood-groen, geel-violet en blauw-oranje."},
{l:"b",p:2,q:"Leg uit waarom Van Gogh in Het nachtcafé rood en groen naast elkaar zette.",
c:[{p:1,t:"Rood en groen zijn complementaire kleuren."},{p:1,t:"Naast elkaar versterken ze elkaar door simultaancontrast: de kleuren worden feller."}],
m:"Rood en groen zijn complementair. Door simultaancontrast versterken ze elkaar als ze naast elkaar staan: beide kleuren lijken feller en het schilderij krijgt meer kracht."},
{l:"c",p:2,q:"Van Gogh mengt rode en blauwe verf. Welke kleur krijgt hij, en is die lichter of donkerder dan de bronkleuren? Leg uit.",
c:[{p:1,t:"Violet (paars)."},{p:1,t:"Donkerder: verf mengen is subtractief; er wordt meer licht geabsorbeerd."}],
m:"Violet. Verf mengen is subtractief: elke verf onttrekt licht, dus er wordt minder teruggekaatst en de mengkleur is donkerder dan de donkerste bronkleur."},
{l:"d",p:1,q:"In een theater worden een rode en een blauwe lamp op hetzelfde vlak gericht. Welke kleur zie je?",c:[{p:1,t:"Magenta (roze-paars)."}],m:"Magenta: rood + blauw licht (additief)."}]},

{id:"n-netvlies",src:"Nieuw",model:"eigen",title:"Staafjes, kegeltjes en de blinde vlek",t:["netvlies"],
fig:{svg:"dichtheid"},
intro:"Eigen oefenbron: de grafiek hierboven is een vereenvoudigde weergave van figuur 26 uit de module. Hij laat zien hoeveel staafjes en kegeltjes er per mm² liggen, op verschillende afstanden van de gele vlek.",
parts:[
{l:"a",p:1,q:"Lees af hoeveel staafjes er per mm² liggen op 20 graden van de gele vlek aan de neuskant.",
fields:[{f:"num",label:"Staafjes",sci:false,unit:"× 10³ per mm²",range:[145,170]}],
c:[{p:1,t:"Ongeveer 155 · 10³ per mm² (tussen 145 en 170 is goed).",auto:"num"}],m:"Ongeveer 155 · 10³ staafjes per mm²."},
{l:"b",p:3,q:"Sterrenkijkers weten: een zwak sterretje zie je beter als je er net naast kijkt. Leg dit uit met de grafiek.",
c:[{p:1,t:"Kijk je er net naast, dan valt het beeld naast de gele vlek, waar veel staafjes liggen (in de gele vlek zelf geen staafjes)."},{p:1,t:"Staafjes werken bij weinig licht (kegeltjes niet)."},{p:1,t:"Meerdere staafjes zijn op één zenuwcel geschakeld: signaalversterking."}],
m:"In de gele vlek liggen alleen kegeltjes, en die werken niet bij weinig licht. Kijk je er net naast, dan valt het beeld op een plek met veel staafjes. Staafjes werken bij weinig licht, en omdat er meerdere op één zenuwcel zijn geschakeld, wordt het signaal versterkt."},
{l:"c",p:1,q:"Rond 15 tot 18 graden aan de neuskant liggen geen staafjes en geen kegeltjes. Hoe heet deze plek en waarom zitten er geen zintuigcellen?",
c:[{p:1,t:"De blinde vlek: daar gaan de zenuwvezels (de oogzenuw) door het netvlies naar buiten."}],
m:"Dat is de blinde vlek. Daar lopen de uitlopers van de zenuwcellen (de oogzenuw) door het netvlies; er is geen plek voor zintuigcellen."}]}
];

<script>
(function(){

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\n/g, "<br>");
const hashStr = s => { let h = 7; for (const ch of s) h = (Math.imul(h, 31) + ch.codePointAt(0)) | 0; return (h >>> 0).toString(36); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const SUP = {"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
const sci = (x, unit) => { if (Math.abs(x) >= 1e-3 && Math.abs(x) < 1e4) return String(Math.round(x * 100) / 100).replace(".", ",") + " " + unit; const e = Math.floor(Math.log10(Math.abs(x))); const m = x / Math.pow(10, e); return m.toFixed(2).replace(".", ",") + " · 10" + String(e).split("").map(ch => SUP[ch]).join("") + " " + unit; };
const num = s => { if (s === undefined || s === null) return NaN; const t = String(s).trim().replace(/\s/g, "").replace(",", "."); return t === "" ? NaN : Number(t); };

});
let CID = null, D = null, INFO = {}, TOPICS = {}, TK = [], FLASH = [], MC = [], OPEN = [], SPRINT = [], TABLES = [], LESSONS = {}, EXAM = null, CONES = [], BANDS = {}, IMG = {}, CAP = {};
const L = k => `#${CID}-${k}`;
const tName = t => (TOPICS[t] && TOPICS[t].s) || t;

// ---------- opslag (per vak) ----------
const fresh = () => ({cards:{}, mc:{}, open:{}, sprint:{}, exams:[], examDate:"", cur:null, lastIds:[]});
const STORES = {};
function loadStore(id){
  if (STORES[id]) return STORES[id];
  let s = fresh();
  try { const raw = localStorage.getItem("anne-" + id + "-v1"); if (raw) s = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  STORES[id] = s; return s;
}
let S = fresh();
function save(){ if (!CID) return; try { localStorage.setItem("anne-" + CID + "-v1", JSON.stringify(S)); } catch (e) {} }

// ---------- thema (standaard licht; donker alleen als Anne dat kiest) ----------
let THEME = "light";
try { THEME = localStorage.getItem("anne-theme") === "dark" ? "dark" : "light"; } catch (e) {}

  document.documentElement.setAttribute("data-theme", THEME);

}

// ---------- statistiek ----------
const cardState = c => S.cards[c.id];
const mastered = c => (cardState(c) && cardState(c).box >= 3);
const isDue = c => { const s = cardState(c); return s && s.due <= Date.now(); };
const topicCards = t => FLASH.filter(c => t === "all" || c.t === t);
const topicMc = t => MC.filter(q => t === "all" || q.t === t);
function mcStats(list){ let ans = 0, ok = 0; list.forEach(q => { const s = S.mc[q.id]; if (s) { ans++; if (s.last) ok++; } }); return {ans, ok, total:list.length}; }
function recordMc(q, right){ const s = S.mc[q.id] || {r:0, w:0, last:false}; if (right) s.r++; else s.w++; s.last = right; S.mc[q.id] = s; save(); }
function daysUntil(str){ if (!str) return null; const d = new Date(str + "T09:00:00"); if (isNaN(d)) return null; const t = new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0); return Math.round((d - t) / DAY); }

// ---------- kegeltjes ----------
function coneAt(l){
  const C = CONES; if (!C.length || isNaN(l)) return null;
  if (l <= C[0][0]) return {S:C[0][1], M:C[0][2], L:C[0][3]};
  if (l >= C[C.length-1][0]) { const z = C[C.length-1]; return {S:z[1], M:z[2], L:z[3]}; }
  for (let i = 0; i < C.length - 1; i++) {
    const a = C[i], b = C[i+1];
    if (l >= a[0] && l <= b[0]) { const f = (l - a[0]) / (b[0] - a[0]); const v = k => Math.round(a[k] + f * (b[k] - a[k])); return {S:v(1), M:v(2), L:v(3)}; }
  }
  return null;
}

};

  if (fig.imgs) fig.imgs.forEach(([n, c]) => paints.push(paintHTML(n, null, c)));
  if (fig.cones) out.push(`<div class="figrow"><div class="paints">${paints.join("")}</div><div class="graph-wrap">${conesSVG({mark: fig.mark || []})}</div></div>`);
  else if (paints.length) out.push(`<div class="paints">${paints.join("")}</div>`);
  if (fig.svg && SVGS[fig.svg]) out.push(SVGS[fig.svg]());
  if (fig.quote) out.push(`<blockquote class="quote">${esc(fig.quote)}</blockquote>${fig.qsrc ? `<p class="qsrc">${esc(fig.qsrc)}</p>` : ""}`);
  return `<div class="fig">${out.join("")}</div>`;
}

// Kegeltjesgrafiek (naar figuur 22 van de module)
function conesSVG(opt){
  opt = opt || {};
  const W = 470, H = 306, x0 = 46, x1 = 455, y0 = 238, y1 = 38, l0 = 390, l1 = 720;
  const X = l => x0 + (l - l0) / (l1 - l0) * (x1 - x0), Y = p => y0 - p / 100 * (y0 - y1);
  const curve = k => { const pts = CONES.map(r => [r[0], r[k]]); let a = 0, b = pts.length - 1; while (a < b && pts[a+1][1] === 0) a++; while (b > a && pts[b-1][1] === 0) b--; return pts.slice(a, b + 1).map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" "); };
  const grid = [0,20,40,60,80,100].map(p => `<line x1="${x0}" x2="${x1}" y1="${Y(p)}" y2="${Y(p)}" style="stroke:var(--grid)" stroke-width="1"/><text x="${x0 - 8}" y="${Y(p) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${p}</text>`).join("");
  const xt = [400,450,500,550,600,650,700].map(l => `<line x1="${X(l)}" x2="${X(l)}" y1="${y0}" y2="${y0 + 5}" style="stroke:var(--muted)"/><text x="${X(l)}" y="${y0 + 32}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${l}</text>`).join("");
  const peaks = [[438,"S",1],[535,"M",2],[577,"L",3]].map(([l, n]) => `<line x1="${X(l)}" x2="${X(l)}" y1="${y1 - 6}" y2="${y0}" style="stroke:var(--faint)" stroke-dasharray="3 4"/><text x="${X(l)}" y="${y1 - 10}" text-anchor="middle" font-size="12" font-weight="800" style="fill:var(--ink)">${n}</text>`).join("");
  const stops = [[390,"#5a0090"],[420,"#4b1cff"],[450,"#2a4cff"],[475,"#0090ff"],[495,"#00c4c4"],[515,"#00c840"],[550,"#8ad400"],[575,"#f2e600"],[595,"#ffb000"],[615,"#ff6a00"],[650,"#f01800"],[700,"#b00000"],[720,"#7a0000"]].map(([l, c]) => `<stop offset="${((l - l0) / (l1 - l0) * 100).toFixed(1)}%" stop-color="${c}"/>`).join("");
  const marks = (opt.mark || []).map(l => { const c = coneAt(l); const dots = [["S","var(--c-s)"],["M","var(--c-m)"],["L","var(--c-l)"]].filter(([k]) => c[k] > 0).map(([k, col]) => `<line x1="${X(l)}" x2="${x0}" y1="${Y(c[k])}" y2="${Y(c[k])}" style="stroke:${col}" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/><circle cx="${X(l)}" cy="${Y(c[k])}" r="4.5" style="fill:${col};stroke:var(--paper)" stroke-width="1.5"/>`).join(""); return `<line x1="${X(l)}" x2="${X(l)}" y1="${y1}" y2="${y0}" style="stroke:var(--ink)" stroke-width="1.6" stroke-dasharray="5 3"/>${dots}<text x="${X(l) + 5}" y="${y0 - 6}" font-size="11" font-weight="800" style="fill:var(--ink)">${l} nm</text>`; }).join("");
  return `<svg class="svgfig cones" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafiek: percentage lichtabsorptie van de blauwe (S), groene (M) en rode (L) kegeltjes bij golflengten van 390 tot 720 nanometer">
    <defs><linearGradient id="spec${opt.id || ""}" x1="0" x2="1" y1="0" y2="0">${stops}</linearGradient></defs>
    <rect x="0" y="0" width="${W}" height="${H}" rx="10" style="fill:var(--paper)"/>
    ${grid}${peaks}
    <path d="${curve(1)}" fill="none" style="stroke:var(--c-s)" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="${curve(2)}" fill="none" style="stroke:var(--c-m)" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="${curve(3)}" fill="none" style="stroke:var(--c-l)" stroke-width="2.6" stroke-linejoin="round"/>
    <rect x="${x0}" y="${y0 + 6}" width="${x1 - x0}" height="12" fill="url(#spec${opt.id || ""})" rx="2"/>
    <line x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}" style="stroke:var(--ink)" stroke-width="1.4"/>
    ${xt}${marks}
    <text x="${x1}" y="${H - 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">golflengte (nm)</text>
    <text x="10" y="14" font-size="11" style="fill:var(--muted)">% lichtabsorptie</text>
  </svg>`;
}

function numValue(fd, v){ let x = num(v.n); if (isNaN(x)) return NaN; if (fd.sci) { const e = num(v.ne); if (!isNaN(e)) x = x * Math.pow(10, e); } return x; }
function numOk(fd, v){ const x = numValue(fd, v); if (isNaN(x)) return false; if (fd.range) return x >= fd.range[0] && x <= fd.range[1]; return Math.abs(x - fd.ans) <= Math.abs(fd.ans) * (fd.tol || 0.03); }
function autoEval(p, v){
  v = v || {}; const fl = fieldsOf(p);
  const ch = fl.find(f => f.f === "choice"), co = fl.find(f => f.f === "cones"), nu = fl.find(f => f.f === "num");
  const lam = num(v.lam), c = co && lam >= 380 && lam <= 760 ? coneAt(lam) : null;
  return p.c.map(cr => {
    switch (cr.auto) {
      case "choice": return ch ? String(v.c) === String(ch.ok) : false;
      case "lambda": { const b = BANDS[co && co.color]; return !!(b && lam >= b[0] && lam <= b[1]); }
      case "cones-types": { if (!c) return false; return ["S","M","L"].every(k => { const real = c[k]; if (real >= 1 && real <= 8) return true; const her = num(v[k]); const h = isNaN(her) ? 0 : her; return (real >= 5) === (h >= 3); }); }
