<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anne leert</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4ede2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%23c06c79%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2234%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}
/* Anne leert. Standaard licht (ook als het apparaat op donker staat); donker alleen via de themaknop, in warme tinten. Landelijk en modern: linnen beige als papier, poederroze en korenbloemblauw als accenten, een fijn ginghamruitje als enige versiering. Links een vaste kolom met navigatie (op telefoon een plakbalk bovenaan), rechts één leeskolom van max. 46rem. Elk vak krijgt een eigen accentkleur (data-accent); groen/oker/rood alleen voor goed/twijfel/fout. */
:root{
  --linen:#f4ede2; --paper:#fffcf6; --sand:#ebe1d1; --line:#e2d6c4; --line-soft:#eee5d7;
  --ink:#2e2a31; --muted:#756a68; --faint:#a39791;
  --rose:#c06c79; --rose-deep:#9a4a58; --rose-soft:#f5dfe0; --rose-mist:#fbefef;
  --blue:#4e75a6; --blue-deep:#365983; --blue-soft:#dde7f3; --blue-mist:#eef3f9;
  --sage:#6c8b6b; --sage-deep:#4f6c4f; --sage-soft:#e1ebdc; --sage-mist:#f0f5ed;
  --ochre:#b08534; --ochre-deep:#87631f; --ochre-soft:#f3e6c8; --ochre-mist:#faf4e6;
  --lilac:#8a71a8; --lilac-deep:#6a5389; --lilac-soft:#e8e0f1; --lilac-mist:#f4f0f9;
  --good:#3d7a55; --good-soft:#dcefe2; --warn:#9a6a14; --warn-soft:#f6ead1; --bad:#b0414c; --bad-soft:#f8dfe1;
  --on-acc:#ffffff;
  --c-s:#3b66c4; --c-m:#2f9256; --c-l:#d3463c; --grid:#e9e0d2;
  --shadow:0 1px 2px rgba(73,52,40,.06),0 4px 16px rgba(73,52,40,.06);
  --check-a:rgba(78,117,166,.12); --check-b:rgba(78,117,166,.07);
  --font-display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px; --r-sm:9px;
  --acc:var(--blue); --acc-deep:var(--blue-deep); --acc-soft:var(--blue-soft); --acc-mist:var(--blue-mist);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --linen:#241d1c; --paper:#2f2725; --sand:#3b322f; --line:#4b403c; --line-soft:#3a312e;
  --ink:#f3e9dd; --muted:#c7b6aa; --faint:#93827a;
  --rose:#e9a7b0; --rose-deep:#f4c6cc; --rose-soft:#513539; --rose-mist:#3a2a2b;
  --blue:#a8c2e4; --blue-deep:#cbdcf2; --blue-soft:#34404f; --blue-mist:#2c2f37;
  --sage:#aac6a6; --sage-deep:#cadfc6; --sage-soft:#36433a; --sage-mist:#2c322c;
  --ochre:#e0bb72; --ochre-deep:#efd4a0; --ochre-soft:#4b3d24; --ochre-mist:#372e22;
  --lilac:#c8b4e2; --lilac-deep:#ddd0f1; --lilac-soft:#40364f; --lilac-mist:#312a37;
  --good:#8fcaa2; --good-soft:#2a3a2e; --warn:#e6bd6c; --warn-soft:#41351f; --bad:#ef969e; --bad-soft:#4a2c2f;
  --on-acc:#241d1c;
  --c-s:#86a8f0; --c-m:#72cc94; --c-l:#f2867a; --grid:#3d3431;
  --shadow:0 1px 2px rgba(0,0,0,.28),0 4px 16px rgba(0,0,0,.22);
  --check-a:rgba(233,167,176,.10); --check-b:rgba(233,167,176,.05);
  color-scheme:dark;
}
/* Accent per vak */
[data-accent="blauw"]{--acc:var(--blue);--acc-deep:var(--blue-deep);--acc-soft:var(--blue-soft);--acc-mist:var(--blue-mist)}
[data-accent="roze"]{--acc:var(--rose);--acc-deep:var(--rose-deep);--acc-soft:var(--rose-soft);--acc-mist:var(--rose-mist)}
[data-accent="salie"]{--acc:var(--sage);--acc-deep:var(--sage-deep);--acc-soft:var(--sage-soft);--acc-mist:var(--sage-mist)}
[data-accent="oker"]{--acc:var(--ochre);--acc-deep:var(--ochre-deep);--acc-soft:var(--ochre-soft);--acc-mist:var(--ochre-mist)}
[data-accent="lila"]{--acc:var(--lilac);--acc-deep:var(--lilac-deep);--acc-soft:var(--lilac-soft);--acc-mist:var(--lilac-mist)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--font-body);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(1.75rem,1.4rem + 1.4vw,2.35rem);font-variation-settings:"SOFT" 60,"WONK" 0}
h2{font-size:1.32rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--acc-deep)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--font-body);font-size:.78em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .35em;background:var(--paper);color:var(--muted)}
.small{font-size:.875rem}.muted{color:var(--muted)}.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--acc-deep)}
.big{font-family:var(--font-display);font-size:2.2rem;font-weight:600;line-height:1.1}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:1rem}
ul.plain{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:.45rem}

/* ---------- app shell ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:15.5rem minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1.1rem;padding-block:1.2rem;padding-left:max(1rem,env(safe-area-inset-left,0px));padding-right:1rem}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--font-display);font-size:1.3rem;font-weight:600;display:block;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.3}
.mark{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.05rem;color:var(--on-acc);background:var(--acc);box-shadow:inset 0 0 0 3px var(--paper),0 0 0 1.5px var(--acc)}
.mark.txt{font-size:.8rem;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:.15rem}
.nav a{display:flex;align-items:center;gap:.65rem;padding:.55rem .7rem;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem}
.nav a svg{width:1.15rem;height:1.15rem;flex:none;color:var(--muted)}
.nav a:hover{background:var(--acc-mist)}
.nav a[aria-current="page"]{background:var(--acc-soft);color:var(--acc-deep)}
.nav a[aria-current="page"] svg{color:var(--acc-deep)}
.nav .nav-back{color:var(--muted);font-weight:600;margin-bottom:.3rem}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem}
.gingham{height:10px;border-radius:3px;background:
  repeating-linear-gradient(90deg,var(--check-a) 0 6px,transparent 6px 12px),
  repeating-linear-gradient(0deg,var(--check-a) 0 6px,var(--check-b) 6px 12px)}
.theme-btn{border:1px solid var(--line);background:var(--linen);border-radius:999px;padding:.4rem .8rem;font-size:.85rem;cursor:pointer;color:var(--muted);text-align:left}
.theme-btn:hover{border-color:var(--acc);color:var(--ink)}
.main{min-width:0;padding-block:2rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));outline:none}
.wrap{max-width:46rem;margin-inline:auto;display:flex;flex-direction:column;gap:1.6rem}
.wrap.wide{max-width:56rem}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:column;gap:.55rem;padding-block:.6rem .5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(60,40,30,.05)}
  .brand b{font-size:1.1rem}.mark{width:2.1rem;height:2.1rem}
  .nav{flex-direction:row;overflow-x:auto;gap:.3rem;margin-inline:-4px;padding:2px 4px 4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;padding:.42rem .7rem;font-size:.88rem;border:1px solid var(--line-soft);background:var(--linen)}
  .nav a svg{width:1rem;height:1rem}
  .nav .nav-back{margin:0}
  .side-foot{display:none}
  .main{padding-block:1.4rem 3rem}
}

/* ---------- common bits ---------- */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:1.15rem 1.25rem;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border-radius:999px;padding:.62rem 1.15rem;font-weight:700;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;text-decoration:none;color:var(--ink);font-size:.97rem;line-height:1.2}
.btn:hover{border-color:var(--acc)}
.btn-primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn-primary:hover{background:var(--acc-deep);border-color:var(--acc-deep)}
.btn-ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-link{background:none;border:0;padding:0;color:var(--acc-deep);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.76rem;font-weight:700;padding:.18rem .55rem;border-radius:999px;background:var(--acc-mist);color:var(--acc-deep);border:1px solid var(--acc-soft);white-space:nowrap}
.tag.rose{background:var(--rose-mist);color:var(--rose-deep);border-color:var(--rose-soft)}
.tag.sand{background:var(--sand);color:var(--muted);border-color:var(--line)}
.callout{border:1px solid var(--rose-soft);background:var(--rose-mist);border-radius:var(--r);padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.35rem}
.callout b{font-family:var(--font-display);font-weight:600;font-size:1.02rem}
.callout.blue{border-color:var(--blue-soft);background:var(--blue-mist)}
.bar{display:block;height:8px;border-radius:99px;background:var(--sand);overflow:hidden;flex:1;min-width:3rem}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.good i{background:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1rem);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:999px;font-weight:700;font-size:.92rem;transition:.25s;z-index:50;display:flex;gap:.4rem;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .h{color:var(--rose)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:.32rem .75rem;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc-deep)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:.38rem .85rem;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.toolbar{display:flex;flex-direction:column;gap:.7rem}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--r)}
.end{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.8rem;padding-block:1.8rem}
.praise{color:var(--good);font-weight:700}
.verdict{font-weight:800}.verdict.good{color:var(--good)}.verdict.bad{color:var(--bad)}
.streak{color:var(--rose-deep);font-weight:800;display:inline-flex;align-items:center;gap:.25rem}

/* ---------- home ---------- */
.hello{display:flex;flex-direction:column;gap:.55rem}
.hello .lede{color:var(--muted);font-size:1.05rem;max-width:38rem}
.hello-band{position:relative;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);padding:1.5rem 1.4rem 1.3rem;overflow:hidden}
.hello-band::after{content:"";position:absolute;inset:auto 0 0 0;height:12px;background:
  repeating-linear-gradient(90deg,rgba(192,108,121,.16) 0 7px,transparent 7px 14px),
  repeating-linear-gradient(0deg,rgba(192,108,121,.16) 0 7px,rgba(192,108,121,.08) 7px 14px)}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:1rem}
.course{display:flex;flex-direction:column;gap:.8rem;padding:1.25rem;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--acc);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
.course:hover{border-color:var(--acc)}
.course-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.course h2{font-size:1.3rem}
.course-stats{display:flex;flex-direction:column;gap:.45rem}
.st{display:flex;align-items:center;gap:.6rem;font-size:.86rem;color:var(--muted)}
.course-meta{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.2rem;color:var(--muted)}
.course .btn{align-self:flex-start}
.course.add{border:1.5px dashed var(--line);border-top-width:1.5px;box-shadow:none;background:transparent;justify-content:center;color:var(--muted)}

/* ---------- start ---------- */
.today{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1rem}
.today-main{background:var(--acc);color:var(--on-acc);border-radius:var(--r);padding:1.3rem 1.35rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;position:relative;overflow:hidden}
.today-main .btn{background:var(--paper);color:var(--acc-deep);border-color:var(--paper);margin-top:.4rem}
.today-main::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px),repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 6px,rgba(255,255,255,.05) 6px 12px)}
.today-side{display:flex;flex-direction:column;gap:1rem}
.countdown input{border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;background:var(--linen);width:100%}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13.5rem),1fr));gap:.8rem}
.mode{display:flex;flex-direction:column;gap:.35rem;padding:1rem 1.1rem;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mode:hover{border-color:var(--acc);background:var(--acc-mist)}
.mode h3{display:flex;align-items:center;gap:.5rem}
.mode h3 svg{width:1.2rem;height:1.2rem;color:var(--acc)}
.mode p{color:var(--muted);font-size:.9rem}
.topics{display:flex;flex-direction:column}
.tp{display:grid;grid-template-columns:5.6rem minmax(0,1fr) 7.5rem 7.5rem;gap:.8rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line-soft);font-size:.9rem}
.tp:last-child{border-bottom:0}
.tp .nm{font-weight:800;color:var(--acc-deep);font-size:.78rem;letter-spacing:.04em}
.tp .st{font-size:.8rem}
@media (max-width:640px){
  .today{grid-template-columns:1fr}
  .tp{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.35rem .8rem}
  .tp .nm{grid-column:1/-1}.tp .tt{grid-column:1/-1;font-weight:700}
}

/* ---------- flashcards ---------- */
.fc{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.4rem 1.6rem;min-height:15rem;display:flex;flex-direction:column;gap:1rem;cursor:pointer;box-shadow:var(--shadow);position:relative}
.fc::before{content:"";position:absolute;left:1.4rem;right:1.4rem;top:0;height:5px;border-radius:0 0 4px 4px;background:var(--acc-soft)}
.fc-meta{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.fc-q{font-family:var(--font-display);font-size:1.32rem;font-weight:500;line-height:1.35}
.fc-a{border-top:1.5px dashed var(--line);padding-top:1rem;font-size:1.02rem}
.fc-hint{margin-top:auto;color:var(--faint);font-size:.88rem}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.rate button{border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:.75rem .4rem;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.25rem}
.rate .r1{color:var(--bad)}.rate .r1:hover{background:var(--bad-soft);border-color:var(--bad)}
.rate .r2{color:var(--warn)}.rate .r2:hover{background:var(--warn-soft);border-color:var(--warn)}
.rate .r3{color:var(--good)}.rate .r3:hover{background:var(--good-soft);border-color:var(--good)}

/* ---------- questions ---------- */
.scoreline{display:flex;flex-wrap:wrap;gap:1rem;font-size:.9rem;color:var(--muted)}
.scoreline b{color:var(--ink)}
.q{display:flex;flex-direction:column;gap:.9rem}
.q-text{font-size:1.05rem;font-weight:600}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.opt{width:100%;display:flex;gap:.75rem;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:.7rem .85rem;cursor:pointer;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc-mist)}
.opt .l{flex:none;width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;background:var(--sand);font-weight:800;font-size:.82rem}
.opt.sel{border-color:var(--acc);background:var(--acc-mist)}.opt.sel .l{background:var(--acc);color:var(--on-acc)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.ok .l{background:var(--good);color:var(--paper)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}.opt.no .l{background:var(--bad);color:var(--paper)}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
.opt.pop{animation:pop .35s ease}
.explain{border-radius:12px;background:var(--linen);border:1px solid var(--line);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem}
.whynot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem;font-size:.93rem}
.whynot li{display:grid;grid-template-columns:1.5rem minmax(0,1fr);gap:.4rem}
.whynot .l{font-weight:800;color:var(--muted)}
.whynot li.mine{color:var(--ink)}.whynot li.mine .l{color:var(--bad)}
.whynot em{font-style:normal;font-weight:700}
.numin{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.numin input{width:6.2rem;border:1.5px solid var(--line);border-radius:9px;padding:.5rem .6rem;background:var(--paper);font-variant-numeric:tabular-nums}
.numin input.exp{width:4.2rem}
.numin .x{color:var(--muted);font-weight:700}
.numin .u{font-weight:700;color:var(--muted)}
.uitwerking{white-space:pre-line;font-variant-numeric:tabular-nums}

/* ---------- figures ---------- */
.fig{margin:0;display:flex;flex-direction:column;gap:.5rem}
.mols{display:flex;flex-wrap:wrap;gap:.6rem}
.mol{margin:0;flex:1 1 9rem;min-width:0;background:#fffefb;border:1px solid var(--line);border-radius:12px;padding:.6rem .6rem .45rem;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.mol img{max-height:150px;width:auto;max-width:100%;object-fit:contain}
.mol.wide{flex-basis:100%}
.mol figcaption{font-size:.85rem;font-weight:700;color:#4a4248;text-align:center}
.paints{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-start}
.paint{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;max-width:100%}
.paint-wrap{position:relative;display:inline-block;line-height:0;border-radius:6px;overflow:visible;box-shadow:0 0 0 6px var(--paper),0 0 0 7px var(--line)}
.paint-wrap img{display:block;width:clamp(10rem,48vw,15.5rem);height:auto;border-radius:3px}
.paint figcaption{font-size:.82rem;color:var(--muted);font-style:italic;padding-top:.35rem;max-width:clamp(10rem,48vw,15.5rem)}
.pointer{position:absolute;width:56px;height:22px;transform:translate(0,-50%);pointer-events:none;line-height:0}
.pointer.flip{transform:translate(-100%,-50%) scaleX(-1)}
.figrow{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-start}
.figrow>*{min-width:0}
.svgfig{width:100%;max-width:34rem;height:auto;display:block}
.svgfig text{font-family:var(--font-body)}
.graph-wrap{flex:1 1 18rem;min-width:0;max-width:30rem}
.quote{margin:0;border-left:4px solid var(--rose);background:var(--rose-mist);padding:.8rem 1rem;border-radius:0 10px 10px 0;font-family:var(--font-display);font-style:italic;font-size:1.02rem}
.quote+.qsrc{font-size:.8rem;color:var(--muted);margin-top:-.2rem}

/* ---------- exam / open ---------- */
.timer{font-weight:800;color:var(--acc-deep);background:var(--acc-mist);border:1px solid var(--acc-soft);padding:.25rem .65rem;border-radius:999px}
.qgrid{display:flex;flex-wrap:wrap;gap:.4rem}
.qgrid button{flex:1 1 0;min-width:4.6rem;max-width:8rem;height:2.4rem;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:800;cursor:pointer;font-size:.86rem;padding-inline:.6rem}
.qgrid button.done{background:var(--acc-mist);border-color:var(--acc-soft)}
.qgrid button.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-soft)}
.opgave{display:flex;flex-direction:column;gap:1.1rem}
.opgave-h{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;flex-wrap:wrap;border-bottom:2px solid var(--acc-soft);padding-bottom:.45rem}
.intro{white-space:pre-line}
.part{display:flex;flex-direction:column;gap:.7rem;padding:1.05rem 1.15rem;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.part-h{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.part-h h3{font-family:var(--font-body);font-weight:800;font-size:1rem}
textarea{width:100%;min-height:6.5rem;resize:vertical;border:1.5px solid var(--line);border-radius:10px;padding:.65rem .75rem;background:var(--linen);line-height:1.5}
textarea:focus,input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
textarea[readonly]{background:var(--sand);min-height:3rem}
.choice{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center}
.choice .lbl{font-weight:700;font-size:.9rem;color:var(--muted);margin-right:.2rem}
.choice label{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);border-radius:999px;padding:.38rem .8rem;cursor:pointer;font-weight:700;font-size:.92rem;background:var(--paper)}
.choice input{accent-color:var(--acc)}
.choice label:has(input:checked){border-color:var(--acc);background:var(--acc-mist);color:var(--acc-deep)}
.conesin{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.45rem .7rem;align-items:center;max-width:22rem;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:var(--linen)}
.conesin label{font-weight:800;font-size:.92rem}
.conesin .ls{color:var(--c-s)}.conesin .lm{color:var(--c-m)}.conesin .ll{color:var(--c-l)}
.conesin .in{display:flex;align-items:center;gap:.35rem}
.conesin input{width:5.2rem;border:1.5px solid var(--line);border-radius:8px;padding:.38rem .5rem;background:var(--paper);font-variant-numeric:tabular-nums}
.model-h{font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc-deep)}
.crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.crit label{display:grid;grid-template-columns:1.3rem minmax(0,1fr) auto;gap:.55rem;align-items:start;padding:.55rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--linen);cursor:pointer}
.crit input{margin-top:.2rem;accent-color:var(--good);width:1.05rem;height:1.05rem}
.crit .pt{font-weight:800;font-size:.85rem;color:var(--good);white-space:nowrap}
.crit label:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.crit .auto{display:block;font-size:.76rem;font-weight:700;color:var(--muted);margin-top:.15rem}
.model{background:var(--blue-mist);border:1px solid var(--blue-soft);border-radius:10px;padding:.8rem .95rem;white-space:pre-line}
.total{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.2rem;border-radius:var(--r);background:var(--acc-soft);color:var(--acc-deep);font-weight:800}
.total b{font-size:1.4rem;font-family:var(--font-display)}
.confirm{background:var(--paper);border:1.5px solid var(--acc);border-radius:var(--r);padding:1rem 1.15rem;display:flex;flex-direction:column;gap:.7rem}
.result-big{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}
.result-big .n{font-family:var(--font-display);font-size:3.2rem;font-weight:600;line-height:1;color:var(--acc-deep)}
.result-big .grade{font-weight:800;color:var(--muted)}
.hist{width:100%;border-collapse:collapse;font-size:.9rem}
.hist th,.hist td{text-align:left;padding:.45rem .4rem;border-bottom:1px solid var(--line-soft)}
.hist th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.olist,.slist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:.8rem}
.ocard{text-align:left;display:flex;flex-direction:column;gap:.45rem;padding:1rem 1.1rem;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);cursor:pointer}
.ocard:hover{border-color:var(--acc);background:var(--acc-mist)}
.ocard .tags{display:flex;flex-wrap:wrap;gap:.3rem}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;min-width:28rem}
.tbl th{background:var(--acc-mist);text-align:left;padding:.55rem .7rem;font-size:.8rem;color:var(--acc-deep);border-bottom:1px solid var(--line)}
.tbl td{padding:.5rem .7rem;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{font-weight:700}
.search{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:.7rem 1.1rem;background:var(--paper)}
.defs{display:flex;flex-direction:column}
.def{display:flex;flex-direction:column;gap:.3rem;padding:.8rem 0;border-bottom:1px solid var(--line-soft)}
.def:last-child{border-bottom:0}
mark{background:var(--rose-soft);color:inherit;border-radius:3px;padding:0 .1em}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:.8rem}
.lesson{display:flex;flex-direction:column;gap:.4rem;padding:1rem 1.1rem;border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.fix .callout{border-color:var(--ochre-soft);background:var(--ochre-mist)}
.fix .callout b{color:var(--ochre-deep)}
.sprint-stmt{font-family:var(--font-display);font-size:1.4rem;font-weight:500;line-height:1.3}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));gap:.5rem}
.choices button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:.7rem .7rem;font-weight:700;cursor:pointer;text-align:left}
.choices button:hover:not(:disabled){border-color:var(--acc);background:var(--acc-mist)}
.choices button.ok{border-color:var(--good);background:var(--good-soft)}
.choices button.no{border-color:var(--bad);background:var(--bad-soft)}
.aflezer{display:flex;flex-direction:column;gap:.8rem}
.aflezer input[type=range]{width:100%;accent-color:var(--acc)}
.readout{display:flex;flex-wrap:wrap;gap:.5rem}
.readout span{border-radius:999px;padding:.3rem .75rem;font-weight:800;font-size:.9rem;border:1.5px solid var(--line);background:var(--paper)}
.readout .s{color:var(--c-s)}.readout .m{color:var(--c-m)}.readout .l{color:var(--c-l)}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{t:"oog",q:"Het oog als fotocamera: wat is wat?",a:"Lenzenstelsel = hoornvlies en ooglens\nDiafragma = iris\nLichtgevoelige filmplaat = netvlies"},
{t:"oog",q:"Hoe staat het beeld op je netvlies?",a:"Omgekeerd: de lens draait het beeld om (boven wordt onder, links wordt rechts). Het linkerdeel van een schilderij valt dus op de rechterhelft van je netvlies. Je hersenen draaien het weer goed."},
{t:"oog",q:"Chiasma opticum",a:"Het kruispunt van de oogzenuwen, vóór de hersenen. De zenuwvezels van de neuskant van elk netvlies kruisen naar de andere hersenhelft. De vezels van de slaapkant kruisen niet."},
{t:"oog",q:"Kruisen alle zenuwbanen van het oog naar de hersenen?",a:"Nee. Alleen de zenuwbanen van de neuskant van het netvlies kruisen in het chiasma opticum. Die van de slaapkant blijven aan dezelfde kant."},
{t:"oog",q:"Wat krijgt elke hersenhelft binnen?",a:"Van beide ogen een half beeld. De rechterhersenhelft verwerkt de linkerhelft van wat je ziet, de linkerhersenhelft de rechterhelft."},
{t:"oog",q:"Waar in je hersenen wordt het linkerdeel van een schilderij verwerkt?",a:"In de rechterhersenhelft (achterin, in het gezichtscentrum).\nDe lens keert het beeld om: het linkerdeel valt op de rechterhelft van beide netvliezen. Bij het linkeroog is dat de neuskant: die vezels kruisen naar rechts. Bij het rechteroog is dat de slaapkant: die vezels kruisen niet en blijven rechts."},
{t:"oog",q:"Waarom kun je met twee ogen diepte zien?",a:"Elk oog ziet een voorwerp vanuit een iets ander perspectief. Elke hersenhelft krijgt halve beelden van beide ogen. De hersenen gebruiken het kleine verschil om de diepte te schatten. Zo zie je de klodders verf en de randen van een schilderij."},
{t:"oog",q:"Primair gezichtscentrum",a:"Het deel van de hersenschors, achter in de hersenen, waar de signalen van de ogen aankomen en het beeld ontstaat."},

// ---------- NETVLIES (4.3) ----------
{t:"netvlies",q:"Uit welke twee lagen bestaat het netvlies?",a:"1. Pigmentlaag: cellen met zwarte pigmentkorrels die de zintuigcellen beschermen tegen te veel licht.\n2. Zintuigzenuwlaag: meer dan honderd miljoen zintuig- en zenuwcellen, waaronder de staafjes en kegeltjes."},
{t:"netvlies",q:"Fotoreceptoren",a:"De lichtgevoelige zintuigcellen van het netvlies: staafjes en kegeltjes."},
{t:"netvlies",q:"Hoeveel staafjes en kegeltjes heeft een netvlies?",a:"Ongeveer 120 miljoen staafjes en 5 miljoen kegeltjes. Dus veel meer staafjes."},
{t:"netvlies",q:"Staafjes: waar liggen ze en wat doen ze?",a:"Vooral aan de rand van het netvlies.\nWerken bij weinig licht, doen niets bij fel licht.\nZien alleen grijstinten (contrast).\nBelangrijk voor het opmerken van beweging."},
{t:"netvlies",q:"Kegeltjes: waar liggen ze en wat doen ze?",a:"Vooral in het midden van het netvlies; in de gele vlek zitten alleen kegeltjes.\nWerken alleen bij voldoende licht.\nZien kleur en details."},
{t:"netvlies",q:"Waarom zie je met kegeltjes veel details?",a:"Elk kegeltje heeft een één-op-één-aansluiting op een eigen zenuwcel. Elk puntje van het beeld geeft dus een eigen signaal."},
{t:"netvlies",q:"Waarom zie je met staafjes beter bij weinig licht?",a:"Meerdere staafjes zijn geschakeld op één zenuwcel. Hun signalen worden opgeteld: signaalversterking. Nadeel: je ziet minder details."},
{t:"netvlies",q:"Gele vlek",a:"De plek in het midden van het netvlies, recht achter de pupil. Er zitten alleen kegeltjes. Hier zie je het scherpst en in kleur."},
{t:"netvlies",q:"Blinde vlek",a:"De plek waar de uitlopers van de zenuwcellen (de oogzenuw) dwars door het netvlies naar buiten gaan. Daar zitten geen zintuigcellen, dus wat daar op valt zie je niet. Ligt aan de neuskant van het netvlies."},
{t:"netvlies",q:"Waarom zie je in het donker bijna geen kleur?",a:"Bij weinig licht werken alleen de staafjes en die zien alleen grijstinten. De kegeltjes (kleur) werken alleen bij voldoende licht."},
{t:"netvlies",q:"De drie typen kegeltjes",a:"S (short): blauw, meest gevoelig bij ca. 430 nm\nM (middle): groen, ca. 535 nm\nL (long): rood, ca. 575 nm"},
{t:"netvlies",q:"Hoe bepalen de kegeltjes welke kleur je ziet?",a:"Door de verhouding tussen hoe sterk de drie typen kegeltjes worden geactiveerd. Worden alle drie evenveel geactiveerd, dan zie je wit."},
{t:"netvlies",q:"Oranje van 610 nm (figuur 22): welke kegeltjes?",a:"Rode kegeltjes (L): 75%\nGroene kegeltjes (M): 13%\nBlauwe kegeltjes (S): 0%"},
{t:"netvlies",q:"Hoe lees je de kegeltjesgrafiek (figuur 22) af?",a:"1. Kies de golflengte die bij de kleur hoort.\n2. Trek bij die golflengte een verticale lijn.\n3. Kijk waar die lijn elke curve snijdt en lees het percentage af op de y-as.\nNoem alle drie de kegeltjes, ook als het 0% is."},
{t:"netvlies",q:"Geel van ca. 580 nm: welke kegeltjes?",a:"Rood (L): ongeveer 100%\nGroen (M): ongeveer 40%\nBlauw (S): 0%\nRood en groen samen zie je als geel."},
{t:"netvlies",q:"Figuur 26: hoe zijn staafjes en kegeltjes verdeeld?",a:"Kegeltjes: een hoge piek precies op de gele vlek, daarbuiten heel weinig.\nStaafjes: geen op de gele vlek, de meeste op ongeveer 20 graden ervandaan.\nBlinde vlek (ca. 15-20 graden naar de neuskant): geen staafjes en geen kegeltjes."},

// ---------- KLEUR (4.4 en 4.5) ----------
{t:"kleur",q:"Welke drie eigenschappen van kleur kunnen mensen onderscheiden?",a:"Tint: de kleurnaam (kleuren van de regenboog).\nVerzadiging: hoe puur de kleur is, hoe weinig wit erin zit.\nHelderheid: hoe licht of donker de kleur is."},
{t:"kleur",q:"Verzadiging",a:"De hevigheid of puurheid van een kleurtint: hoe weinig wit erin zit. Hoe meer wit, hoe minder verzadigd."},
{t:"kleur",q:"Contrast",a:"Het verschil tussen lichte en donkere delen. Tussen zwart en wit is het contrast groot, tussen grijstinten klein."},
{t:"kleur",q:"Complementaire kleuren",a:"Kleuren die tegenover elkaar staan in de kleurencirkel. Naast elkaar versterken ze elkaar."},
{t:"kleur",q:"Complementaire paren volgens Charles Blanc (verf, Van Gogh)",a:"Rood en groen\nGeel en violet (paars)\nBlauw en oranje"},
{t:"kleur",q:"Complementaire paren in de kleurencirkel van licht",a:"Rood en cyaan\nGroen en magenta\nBlauw en geel"},
{t:"kleur",q:"Primaire kleuren bij verf (Charles Blanc) en bij licht",a:"Verf (Blanc): rood, geel, blauw.\nLicht (additief): rood, groen, blauw."},
{t:"kleur",q:"Additieve kleurmenging",a:"Mengen van licht (beeldscherm, theater). Je begint bij zwart en telt licht op. Primaire kleuren: rood, groen, blauw. De mengkleur is lichter dan de lichtste bronkleur. Alles samen: wit."},
{t:"kleur",q:"Subtractieve kleurmenging",a:"Mengen van verf. Elke verf onttrekt (absorbeert) een deel van het licht. Er wordt steeds minder teruggekaatst, dus de mengkleur is donkerder dan de donkerste bronkleur."},
{t:"kleur",q:"Licht mengen: rood + groen, rood + blauw, groen + blauw",a:"Rood + groen = geel\nRood + blauw = magenta\nGroen + blauw = cyaan\nAlle drie = wit"},
{t:"kleur",q:"Verf mengen: rood + blauw, blauw + geel, geel + rood",a:"Rood + blauw = violet (paars)\nBlauw + geel = groen\nGeel + rood = oranje"},
{t:"kleur",q:"Simultaancontrast",a:"Dezelfde kleur ziet er anders uit, afhankelijk van de kleuren eromheen (simultaan = gelijktijdig). Het effect is het sterkst bij complementaire kleuren."},
{t:"kleur",q:"Nabeeld",a:"Als je een tijd naar een kleur staart en dan naar wit kijkt, zie je de tegenkleur. Na rood zie je groen, na groen zie je rood."},
{t:"kleur",q:"Verklaring van een nabeeld (opponente processen)",a:"Signalen van de kegeltjes gaan via drie tegengestelde kanalen: rood-groen, geel-blauw en zwart-wit.\nStaar je naar groen, dan raakt de groene kant uitgeput. Kijk je daarna naar wit (dat stimuleert alles), dan reageert de rode kant sterker. De balans slaat door naar rood: je ziet een rood nabeeld."},
{t:"kleur",q:"Waarom kun je geen ‘geelachtig blauw’ zien?",a:"Geel en blauw zitten in hetzelfde opponente kanaal. Je ziet het een of het ander, nooit allebei tegelijk. Hetzelfde geldt voor rood en groen."},
{t:"kleur",q:"Waarom zette Van Gogh complementaire kleuren naast elkaar?",a:"Complementaire kleuren versterken elkaar door simultaancontrast. De kleuren lijken feller en het schilderij krijgt meer kracht."},
{t:"kleur",q:"Grijze schaduwstreepjes in een oranjegeel korenveld",a:"Je ziet ze als blauwviolet, de complementaire kleur van oranjegeel. Dat is simultaancontrast."},
{t:"kleur",q:"Bolletjes wol",a:"Van Gogh testte kleurcombinaties met een doosje bolletjes wol. Hij legde bolletjes naast elkaar of wond draden om elkaar, om het effect van kleuren, helderheid en verzadiging te zien."},
{t:"kleur",q:"Hoe veranderde het palet van Van Gogh?",a:"Van donkere ‘modderkleuren’ (zoals Spoelwiel, 1885) naar lichte, heldere kleuren (zoals Zonnebloemen, 1889)."},
{t:"kleur",q:"Pointillisme",a:"Stippeltechniek: kleine stipjes kleur naast elkaar, vaak complementair. Op afstand mengen ze in je oog en ontstaat een soort ‘vibrato’. Van Gogh experimenteerde ermee in Parijs (Seine-oever, 1887)."},
{t:"kleur",q:"Zelfportret met verbonden oor: welke contrasten?",a:"Een oranje en rode achtergrond tegenover de blauwe muts en de groene jas. Dat zijn complementaire paren (oranje-blauw, rood-groen). Van Gogh deed dat bewust: zijn atelier had witte muren."},

// ---------- VERF (5.2) ----------
{t:"verf",q:"Wat is verf?",a:"Een mengsel van een pigment (of kleurstof) met een bindmiddel en eventueel een oplosmiddel (verdunningsmiddel)."},
{t:"verf",q:"Pigment",a:"Een poeder van kleine, onoplosbare, sterk gekleurde korrels. Het wordt pas verf als je het mengt met een bindmiddel."},
{t:"verf",q:"Kleurstof",a:"Meestal organisch en lost op in water. Hecht aan het te kleuren materiaal (inkt, kleding). Vaak een intense kleur, maar slecht tot matig lichtecht. Voorbeeld: indigo."},
{t:"verf",q:"Verschil tussen kleurstof en pigment",a:"Een kleurstof lost op (in water). Een pigment lost niet op: het bestaat uit onoplosbare korrels en heeft een bindmiddel nodig om verf te worden."},
{t:"verf",q:"Vijf belangrijke eigenschappen van pigmenten",a:"1. Lichtechtheid\n2. Oplosbaarheid in het bindmiddel\n3. Dekkend vermogen (transparantie)\n4. Grootte van de korrels\n5. Chemische reactiviteit (inertheid)"},
{t:"verf",q:"Lichtechtheid",a:"Of een pigment vervaagt of verkleurt door licht. UV-licht heeft genoeg energie om chemische bindingen te verbreken. Het molecuul verandert en absorbeert daardoor ander licht: de kleur verbleekt of verandert."},
{t:"verf",q:"Het ‘bloeden’ van een schilderij",a:"Het pigment lost op in de olie en trekt in de verflagen erboven of eronder. Zo ontstaan ongewenste kleurmengingen. Vooral organische pigmenten doen dit. Een pigment moet dus ‘olieproof’ zijn."},
{t:"verf",q:"Loodverf in een ruimte met waterstofsulfide (H₂S)",a:"Lood reageert met H₂S tot zwart loodsulfide (PbS). De verf wordt donkerder. Dit is een voorbeeld van chemische reactiviteit."},
{t:"verf",q:"Organische pigmenten: herkomst, voordeel en nadelen",a:"Herkomst: planten en dieren (nu ook synthetisch); opgebouwd uit koolstofverbindingen.\nVoordeel: intense, warme kleuren.\nNadelen: niet lichtecht (vervagen), veel moeite voor weinig pigment, kleur is niet altijd hetzelfde."},
{t:"verf",q:"Anorganische pigmenten",a:"Afkomstig uit mineralen of verweerd gesteente (aardpigmenten zoals oker en omber, meestal metaaloxiden). Bevatten bijna altijd metalen uit het d-blok (overgangsmetalen)."},
{t:"verf",q:"Synthetische pigmenten: wat en welke voordelen?",a:"Pigmenten die in het laboratorium gemaakt worden.\nVoordelen: je kunt eigenschappen maken die in de natuur niet voorkomen, en ze zijn bijna altijd lichtecht."},
{t:"verf",q:"Lakpigment",a:"Een pigment gemaakt van een kleurstof. De kleurstof laat je adsorberen (hechten) aan een onoplosbare witte vaste stof. Meestal maak je die witte stof uit aluin (een aluminiumzout) en kaliloog (KOH). Ontdekt door George Field in 1804."},
{t:"verf",q:"Drie klassieke rode lakpigmenten",a:"Kraplak: plantaardig, uit de meekrapwortel, kleurstof alizarine.\nCochenillelak: dierlijk, uit de cochenilleluis, kleurstof karmijn; de kleur is stabiel.\nGeraniumlak: synthetisch, met de kleurstof eosine."},
{t:"verf",q:"Geraniumlak",a:"Een fel rozerood lakpigment met eosine als kleurstof. Niet stabiel: het vervaagt. Van Gogh wist dat en zette de kleur daarom extra sterk aan. Hij gebruikte het onder andere in De slaapkamer."},
{t:"verf",q:"Functies van het bindmiddel",a:"1. Plakt de pigmentkorrels aan elkaar.\n2. Laat ze hechten aan de drager (het doek).\n3. Vormt een beschermend laagje om elke korrel.\n4. Werkt als smeermiddel: de korrels glijden over elkaar.\nDaarnaast vult het de lege ruimtes tussen de korrels."},
{t:"verf",q:"Wat gebeurt er als verf te weinig olie bevat?",a:"Niet alle korrels kleven aan elkaar. Na het drogen wordt de verflaag poederig en laat hij los."},
{t:"verf",q:"Bindmiddel van tempera, olieverf, aquarel en acryl",a:"Tempera: eigeel\nOlieverf: lijnolie\nAquarel: Arabische gom\nAcryl: synthetisch polymeer"},
{t:"verf",q:"Lijnolie",a:"Een plantaardige, drogende olie die je krijgt door lijnzaad uit te persen. Lijnzaad is het zaad van de vlasplant. Van de vezels van vlas maakt men linnen voor schildersdoek."},
{t:"verf",q:"Functie van het oplosmiddel",a:"Het verdunt verf die te dik is, zodat je hem beter kunt verwerken. Tijdens het drogen verdampt het oplosmiddel."},
{t:"verf",q:"Terpentijn en terpentine",a:"Terpentijn: vloeibare hars uit naaldbomen; oplosmiddel voor verf.\nTerpentine: gemaakt uit aardolie; goedkoper, voor het schoonmaken van kwasten."},
{t:"verf",q:"Vet over mager: wat betekent dat?",a:"Magere verf is verdund met terpentijn en droogt snel. Vette verf is verdund met lijnolie en droogt langzamer. Schilder altijd vette verf op magere verf. Doe je het andersom, dan gaat de magere bovenlaag scheuren, omdat de vette laag eronder nog lang beweegt en droogt."},
{t:"verf",q:"Fysisch droogproces van olieverf",a:"Het oplosmiddel verdampt. Pigment en bindmiddel komen dichter bij elkaar en trekken elkaar aan door vanderwaalskrachten. Er ontstaat een harde film."},
{t:"verf",q:"Chemisch droogproces van olieverf",a:"De dubbele bindingen (C=C) in de onverzadigde vetzuren van de olie reageren onder invloed van licht met zuurstof uit de lucht. De opgenomen zuurstof vormt bruggen tussen de ketens: polymerisatie (vernetting). In dit netwerk zitten de pigmentkorrels vast."},
{t:"verf",q:"Waarom zijn onverzadigde vetzuren nodig bij het chemisch drogen?",a:"Alleen de dubbele bindingen (C=C) kunnen met zuurstof reageren en bruggen tussen de ketens vormen. Verzadigde vetzuren hebben geen dubbele bindingen."},
{t:"verf",q:"Waarom is licht nodig bij het chemisch drogen?",a:"Het ultraviolette deel van het licht levert de energie die nodig is om de reactie met zuurstof te laten verlopen."},
{t:"verf",q:"Welk gas is nodig bij het chemisch drogen?",a:"Zuurstof (O₂) uit de lucht."},
{t:"verf",q:"Waarvan hangt de droogtijd van olieverf af?",a:"Temperatuur, het type olie, de dikte van de verflaag, de lichtintensiteit en de aanwezigheid van bepaalde pigmenten. Kobaltblauw en loodwit werken als katalysator en versnellen het drogen."},
{t:"verf",q:"Emulsie",a:"Een mengsel van twee vloeistoffen die niet in elkaar oplossen, zoals water en olie. Zonder emulgator valt het weer uit elkaar (ontmengt)."},
{t:"verf",q:"Emulgator: hoe werkt het?",a:"Een emulgator heeft een polair (hydrofiel) deel en een apolair (hydrofoob, lipofiel) deel. Hij gaat op de grens tussen water en vet zitten: de polaire kop naar het water, de apolaire staart naar het vet. Hij verlaagt de oppervlaktespanning. Voorbeeld: lecithine in eigeel."},
{t:"verf",q:"Ei-tempera: hoe droogt het en waarom azijn?",a:"Eerst verdampt het water. De eiwitten denatureren en zijn daarna niet meer oplosbaar in water. De verzadigde vetten veranderen niet, maar houden de laag soepel. Azijn voeg je toe tegen bederf."},
{t:"verf",q:"Heeft olieverf een emulgator nodig?",a:"Nee. In olieverf zit geen water: het pigment zit in olie (eventueel met terpentijn, dat met olie mengt). Er zijn dus geen twee niet-mengbare vloeistoffen."},

{t:"verf",q:"Practicum geraniumlak: welke neerslag ontstaat er?",a:"Aluin lost op: KAl(SO₄)₂·12H₂O → K⁺ + Al³⁺ + 2 SO₄²⁻ + 12 H₂O\nKaliloog: KOH → K⁺ + OH⁻\nNeerslag: Al³⁺ + 3 OH⁻ → Al(OH)₃ (wit, onoplosbaar). Daaraan hecht de eosine: zo ontstaat het lakpigment."},
{t:"verf",q:"Practicum verkleuren: eosine en methyleenblauw in de zon",a:"De strepen in de zon verbleken door het (UV-)licht; de helft onder aluminiumfolie houdt zijn kleur. De folie is de controle: zelfde papier en tijd, maar zonder licht. Zo zie je dat het licht de oorzaak is."},
{t:"verf",q:"Wat betekent het Griekse woord ‘chroom’?",a:"Kleur. (Chroomverbindingen hebben veel verschillende kleuren.)"},

// ---------- MOLECUUL (5.2 + B1.2) ----------
{t:"molecuul",q:"Belangrijkste voorwaarde voor kleur bij organische stoffen",a:"Meerdere dubbele bindingen in een geconjugeerd systeem: afwisselend enkele en dubbele bindingen."},
{t:"molecuul",q:"Geconjugeerd systeem",a:"Een deel van een molecuul waarin enkele en dubbele bindingen elkaar afwisselen, zoals -C=C-C=C- of een benzeenring. De dubbele bindingen kunnen ‘verspringen’. Dat geeft extra stabiliteit."},
{t:"molecuul",q:"Gedelokaliseerde elektronen",a:"De elektronen van de tweede helften van de dubbele bindingen in een geconjugeerd systeem. Ze horen niet bij één binding, maar bewegen door het hele systeem. Ook wel ‘vrije elektronen’."},
{t:"molecuul",q:"Gelokaliseerde en gedelokaliseerde elektronen: verschil",a:"Gelokaliseerd: vast bij één binding of atoom.\nGedelokaliseerd: verdeeld over het hele geconjugeerde systeem, ze kunnen vrij bewegen."},
{t:"molecuul",q:"Wat doet een groter geconjugeerd systeem met de absorptie?",a:"Meer gedelokaliseerde elektronen betekent dat er minder energie nodig is om een elektron aan te slaan. De absorptie verschuift naar een grotere golflengte: van UV naar violet en blauw, en verder richting rood."},
{t:"molecuul",q:"Grafiet en diamant: kleur",a:"Grafiet heeft extreem veel vrije elektronen en absorbeert alle golflengten: zwart.\nDiamant heeft geen vrije elektronen en absorbeert geen zichtbaar licht: kleurloos."},
{t:"molecuul",q:"Chromofore groep",a:"De kleurdragende groep: het deel van het geconjugeerde systeem dat licht absorbeert. Bevat meervoudige bindingen en werkt als elektronenpaaracceptor.\nVoorbeelden: >C=O, -COOH, -NO₂, >C=C<, -N=N-, >C=S, >C=NH"},
{t:"molecuul",q:"Auxochrome groep",a:"Een groep met vrije elektronenparen (elektronenpaardonor). Versterkt het geconjugeerde systeem: de absorptie en kleur worden intenser.\nVoorbeelden: -OH, -NH₂, -NHR, -OCH₃ en halogenen (-Cl, -Br, -I)"},
{t:"molecuul",q:"Welke kleur zie je van een stof?",a:"De kleur van het licht dat niet geabsorbeerd wordt (teruggekaatst of doorgelaten). Dat is de complementaire kleur van de geabsorbeerde kleur."},
{t:"molecuul",q:"Een stof absorbeert blauw licht. Welke kleur zie je?",a:"Geel. Groen en rood licht worden teruggekaatst; samen zie je die als geel."},
{t:"molecuul",q:"Cochenille is rood. Welk licht wordt geabsorbeerd?",a:"Groen (blauwgroen) licht: de complementaire kleur van rood."},
{t:"molecuul",q:"Waarom is verse vernis kleurloos?",a:"De organische moleculen in vernis hebben dubbele bindingen die alleen UV-straling absorberen. UV is onzichtbaar, dus vernis is kleurloos."},
{t:"molecuul",q:"Waarom vergeelt vernis?",a:"De hars in vernis oxideert. Daarbij ontstaan meer dubbele bindingen, dus meer vrije elektronen. Er is minder energie nodig om een elektron aan te slaan, dus de absorptie verschuift van UV naar blauw. Groen en rood worden teruggekaatst: je ziet geel."},
{t:"molecuul",q:"Absorberen en adsorberen",a:"Absorberen: (licht of een stof) opnemen.\nAdsorberen: hechten aan een oppervlak, zoals een kleurstof aan aluminiumhydroxide bij een lakpigment."},
{t:"molecuul",q:"Aanslaan (exciteren) van een elektron",a:"Een foton met precies de juiste energie wordt geabsorbeerd. Een elektron springt naar een hoger energieniveau. Fotonen met een andere energie worden doorgelaten of teruggekaatst."},

// ---------- COMPLEX (5.2 + B1.1) ----------
{t:"complex",q:"Overgangsmetalen",a:"Metalen uit het d-blok van het periodiek systeem, zoals Cr, Mn, Fe, Co, Ni en Cu. Ze hebben een gedeeltelijk gevulde d-schil. Daardoor vormen ze complexen, komen ze voor met verschillende ladingen en zijn hun zouten gekleurd."},
{t:"complex",q:"Ligand",a:"Een molecuul of ion met een vrij elektronenpaar. Met dat elektronenpaar vormt het een binding met een metaalatoom of metaalion. Voorbeelden: H₂O, NH₃, Cl⁻, CN⁻, SCN⁻, CO."},
{t:"complex",q:"Complex (complexe verbinding)",a:"Een centraal metaalatoom of -ion dat omringd is door liganden. Is het geladen, dan heet het een complex ion; er hoort dan een tegenion bij. Notatie tussen rechte haken, bijv. [Cu(NH₃)₄]²⁺."},
{t:"complex",q:"Gecoördineerde covalente binding",a:"Een binding waarbij één van beide partners het hele elektronenpaar levert. Het ligand levert het paar (elektronenpaardonor); het metaalion neemt het aan (elektronenpaaracceptor)."},
{t:"complex",q:"Hoe ontstaat de kleur van een complex?",a:"De liganden zorgen voor een splitsing van de energieniveaus van het metaalion. Licht met precies die energie (de splitsingsenergie Δ) wordt geabsorbeerd. Je ziet de complementaire kleur."},
{t:"complex",q:"Waarvan hangt de splitsingsenergie Δ af?",a:"Van het soort metaalion en het soort ligand. (Ook de ruimtelijke verdeling van de liganden speelt mee.)"},
{t:"complex",q:"Verdringingsreeks (spectrochemische reeks)",a:"I⁻ < Br⁻ < S²⁻ < SCN⁻ < Cl⁻ < NO₃⁻ < F⁻ < OH⁻ < H₂O < NH₃ < ethaan-1,2-diamine < NO₂⁻ < CN⁻ < CO\nLinks: zwakke liganden, kleine Δ. Rechts: sterke liganden, grote Δ."},
{t:"complex",q:"Wat gebeurt er als je een sterker ligand toevoegt?",a:"Het sterkere ligand verdringt het zwakkere en gaat om het metaalion zitten. Δ wordt groter: het complex absorbeert licht met meer energie (kleinere golflengte). De kleur verandert."},
{t:"complex",q:"Rode verf: grote of kleine Δ?",a:"Rode verf absorbeert groen licht. Groen heeft een vrij kleine golflengte en dus veel energie. Daar hoort een grote splitsingsenergie Δ bij (groter dan bij een blauwe verf, die oranje licht absorbeert)."},
{t:"complex",q:"Substitutiereactie en elektronoverdrachtreactie",a:"Substitutie: het ene ligand wordt vervangen door een ander; de kleur verandert.\nElektronoverdracht: in een stof met hetzelfde element in twee ladingen laat licht een elektron overspringen van het ene ion naar het andere. Dat is een redoxreactie."},
{t:"complex",q:"Pruisisch blauw",a:"Fe₄[Fe(CN)₆]₃, met Fe²⁺ en Fe³⁺. De intense kleur komt door ladingsoverdracht tussen Fe²⁺ en Fe³⁺. Eén van de eerste synthetische pigmenten: 1704, Diesbach in Berlijn. Koel blauw, neigt naar groen. Verkleurt naar bruin door hitte of kalk."},
{t:"complex",q:"Kobaltblauw",a:"CoAl₂O₄. De waterliganden van kobaltchloride zijn verdrongen door aluminium en zuurstof (complexvorming). Ontdekt door Thénard in 1802. Stabiel, de enige blauwe met een goede dekkracht. Warm blauw, neigt naar rood."},
{t:"complex",q:"Complexvorming en redox: verschil",a:"Complexvorming: de donor geeft een elektronenpaar voor een binding; de lading van het element blijft gelijk.\nRedox: losse elektronen gaan van de reductor naar de oxidator; de lading verandert."},
{t:"complex",q:"Hoe teken je een metaalion met watermoleculen eromheen?",a:"Het O-atoom van elk watermolecuul wijst naar het positieve metaalion: O heeft vrije elektronenparen en een negatieve lading (δ⁻). De H-atomen wijzen naar buiten."},
{t:"complex",q:"Ruimtelijke bouw van complexen",a:"Octaëder: 6 liganden, bijv. [Fe(CN)₆]³⁻\nVierkant plat vlak: bijv. [Ni(CN)₄]²⁻\nTetraëder: bijv. [NiCl₄]²⁻"},
{t:"complex",q:"Ethaan-1,2-diamine als ligand",a:"Een ligand met twee N-atomen, die elk een vrij elektronenpaar hebben. Eén molecuul levert dus twee elektronenparen en verdringt twee waterliganden."},
{t:"complex",q:"Oxidator en reductor",a:"Oxidator: neemt elektronen op.\nReductor: staat elektronen af.\nSamen vormen ze een redoxreactie: de lading van de deeltjes verandert."},

{t:"complex",q:"Practicum Pruisisch blauw: neerslagvergelijking",a:"FeCl₃ → Fe³⁺ + 3 Cl⁻\nK₄[Fe(CN)₆]·3H₂O → 4 K⁺ + [Fe(CN)₆]⁴⁻ + 3 H₂O\nNeerslag: 4 Fe³⁺ + 3 [Fe(CN)₆]⁴⁻ → Fe₄[Fe(CN)₆]₃\nJe spoelt het neerslag om de opgeloste ionen (K⁺, Cl⁻) weg te halen."},
{t:"complex",q:"Practicum kobaltblauw: welke damp ontstaat?",a:"Waterstofchloride (HCl) en waterdamp. De damp is zuur (vochtig pH-papier kleurt rood) en niet brandbaar. HCl is schadelijk: werk in de zuurkast."},
{t:"netvlies",q:"Bij welke golflengte is elk type kegeltje het gevoeligst (opdracht 4b)?",a:"Blauw (S): ca. 430 nm\nGroen (M): ca. 535 nm\nRood (L): ca. 575 nm\n(zo staat het onder figuur 22)"},

// ---------- VERKLEURING (5.3 en 5.4) ----------
{t:"verkleuring",q:"Noem oorzaken van verkleuring van verf",a:"Licht en zuurstof (UV), vergelen van de vernis, vervuiling, gassen (NH₃, SOₓ, NOₓ), zwavelhoudende stoffen, hitte, het bindmiddel en de grondlaag."},
{t:"verkleuring",q:"Hoe laten licht en zuurstof verf verkleuren?",a:"UV-straling heeft veel energie en verbreekt bindingen in het pigment. De moleculen vallen uiteen in kleinere stukken en absorberen ander licht. De kleur verbleekt of verdwijnt. Organisch rood ontkleurt, oranje en paars verbleken, groen wordt bruin, geel wordt donker."},
{t:"verkleuring",q:"Vervuiling als oorzaak van verkleuring",a:"Water, vet, stof en roet hechten aan het schilderij en vormen een donkere film. Roet is zuur en vreet door de vernis. Stof trekt vocht aan: voedingsbodem voor schimmels. Vooral bij dikke verfstreken (impasto)."},
{t:"verkleuring",q:"Gassen als oorzaak van verkleuring",a:"NH₃, SOₓ en NOₓ komen via de ventilatie, apparatuur of schoonmaakmiddelen binnen. Ze zorgen voor verzuring: de structuur van de verf en dus de kleur valt uiteen."},
{t:"verkleuring",q:"Loodpigment en zwavel",a:"Loodhoudende pigmenten reageren met zwavelhoudende stoffen en worden lichtgrijs tot diep zwart. Olie beschermt hier in principe tegen, dus het komt vaker voor bij waterverf."},
{t:"verkleuring",q:"Gele oker bij hitte",a:"Gele oker verkleurt naar rood of bruin, doordat alle waterliganden verdwijnen."},
{t:"verkleuring",q:"Waarom maakt men witte verf vaak met maanzaadolie?",a:"Olie vergeelt doordat het reageert met zuurstof. Maanzaadolie vergeelt minder sterk dan lijnolie (maar droogt wel veel langzamer)."},
{t:"verkleuring",q:"Functies van de grondlaag",a:"Voorkomt dat verf in het doek zakt (anders verpoedert de verf en zwakt de kleur af), maakt het doek glad, zorgt voor hechting tussen doek en verf, en heeft een visuele functie: de kleur van de grondering schijnt door. Een witte grond kan het ontkleuren versnellen."},
{t:"verkleuring",q:"De slaapkamer: kleuren volgens de brief aan Theo",a:"Muren bleek violet, vloer rode plavuizen, bed en stoelen geel als verse boter, laken en kussens citroengroen, deken scharlakenrood, raam groen, toilettafel oranje, waskom blauw, deuren lila."},
{t:"verkleuring",q:"Waarom zijn de muren van De slaapkamer nu blauw?",a:"Het violet was gemengd van blauw (Pruisisch blauw en kobaltblauw), wit en het rode geraniumlak (eosine). Het geraniumlak is niet lichtecht en is door licht verbleekt. Alleen het blauw is overgebleven."},
{t:"verkleuring",q:"Waarom is de kracht van De slaapkamer verdwenen?",a:"Van Gogh schilderde complementaire paren naast elkaar (rood-groen, geel-paars, blauw-oranje). Door de verkleuring zijn die paren niet meer in balans."},
{t:"verkleuring",q:"Waarom worden de Zonnebloemen bruin?",a:"Chroomgeel (PbCrO₄, met Cr⁶⁺) verandert onder UV-straling. Cr⁶⁺ wordt Cr³⁺. Aan het oppervlak ontstaat een dun groen laagje Cr₂O₃·2H₂O (viridiaangroen); het lood vormt zwart PbO₂. Al die kleuren samen geven de indruk van bruin."},
{t:"verkleuring",q:"Halfreactie van Cr⁶⁺ naar Cr³⁺",a:"Cr⁶⁺ + 3 e⁻ → Cr³⁺\nCr⁶⁺ neemt elektronen op: het is een reductie en Cr⁶⁺ is de oxidator."},
{t:"verkleuring",q:"Waarom kunnen chroomionen meerdere kleuren hebben?",a:"Chroom is een overgangsmetaal en komt voor met verschillende ladingen, zoals Cr⁶⁺ en Cr³⁺. De kleur hangt af van de lading (en de liganden): Cr⁶⁺ in chroomgeel is geel, Cr³⁺ in chroomoxide is groen."},
{t:"verkleuring",q:"Belangrijkste regel bij restaureren",a:"Alles wat een restaurator doet, moet weer ongedaan gemaakt kunnen worden zonder het schilderij te beschadigen. Een schilderij is uniek, en later zijn er misschien betere technieken of nieuwe inzichten."},
{t:"verkleuring",q:"Welke vragen stelt een restaurator vooraf?",a:"Welk pigment heeft de schilder gebruikt? (belangrijk voor echtheid en datering)\nZit er vergeelde vernis op?\nZien we de originele kleur, of is die verkleurd?"},
{t:"verkleuring",q:"Hoe voorkom je verdere verkleuring in een museum?",a:"Weinig licht en vooral weinig UV (filters, gedimd licht), schone gefilterde lucht zonder schadelijke gassen, constante temperatuur en luchtvochtigheid, en het schilderij schoon houden."},
{t:"verkleuring",q:"Hoe hebben onderzoekers de oorspronkelijke kleuren van De slaapkamer teruggevonden?",a:"Met de beschrijving in de brief van Van Gogh, kennis van zijn pigmenten en hoe die verouderen, en onderzoek van kleine verfmonsters (dwarsdoorsnede: onder het oppervlak zit nog rood pigment). Zo maakten ze een digitale reconstructie."},

{t:"verkleuring",q:"IJzeren spijker in kopersulfaat: halfreacties",a:"Reductor: Fe → Fe²⁺ + 2 e⁻\nOxidator: Cu²⁺ + 2 e⁻ → Cu\nTotaal: Fe + Cu²⁺ → Fe²⁺ + Cu\nRedoxkoppels: Fe/Fe²⁺ en Cu²⁺/Cu."},
{t:"verkleuring",q:"Koper met verdund salpeterzuur: halfreacties en totaal",a:"Oxidator: NO₃⁻ + 4 H⁺ + 3 e⁻ → NO + 2 H₂O\nReductor: Cu → Cu²⁺ + 2 e⁻\nTotaal (× 2 en × 3): 2 NO₃⁻ + 8 H⁺ + 3 Cu → 2 NO + 4 H₂O + 3 Cu²⁺"},
{t:"verkleuring",q:"Redoxkoppel",a:"Een oxidator en een reductor die bij elkaar horen, zoals Cu²⁺/Cu of Cr⁶⁺/Cr³⁺. Een redoxreactie bestaat altijd uit twee halfreacties."},

// ---------- LICHT (bijlage 2) ----------
{t:"licht",q:"Elektromagnetisch spectrum van korte naar lange golflengte",a:"Gammastraling, röntgenstraling, ultraviolet, zichtbaar licht, infrarood, microgolven, radiogolven.\nKorte golven: hoge frequentie, veel energie."},
{t:"licht",q:"Golflengte van zichtbaar licht",a:"Van ongeveer 400 nm (violet) tot 750 nm (rood), dus 4,0 · 10⁻⁷ m tot 7,5 · 10⁻⁷ m."},
{t:"licht",q:"Kleuren en golflengten (ongeveer)",a:"Violet: 400-450 nm\nBlauw: 450-490 nm\nGroen: 490-560 nm\nGeel: 560-590 nm\nOranje: 590-630 nm\nRood: 630-750 nm"},
{t:"licht",q:"Formule voor de energie van een foton",a:"E = h · f = h · c / λ\nE in joule, h = 6,626 · 10⁻³⁴ J s, f in hertz, λ in meter, c = 3,00 · 10⁸ m/s."},
{t:"licht",q:"Formule voor de frequentie",a:"f = c / λ (λ in meter!)"},
{t:"licht",q:"1 nanometer in meter",a:"1 nm = 10⁻⁹ m. Dus 480 nm = 480 · 10⁻⁹ m = 4,80 · 10⁻⁷ m."},
{t:"licht",q:"Elektronvolt (eV)",a:"1 eV = 1,6 · 10⁻¹⁹ J. Het is de energie die een elektron krijgt als het een spanningsverschil van 1 volt doorloopt."},
{t:"licht",q:"Energie van zichtbaar licht in eV",a:"Ongeveer 1,7 eV (rood) tot 3,2 eV (violet)."},
{t:"licht",q:"Lange of korte golflengte: welke heeft meer energie?",a:"Korte golflengte: hogere frequentie en dus meer energie per foton. Daarom kan UV bindingen verbreken en zichtbaar licht meestal niet."}
];

{t:"netvlies",k:"Staafjes",q:"In een schemerige museumzaal zie je de vormen van een schilderij wel, maar bijna geen kleur. Welke verklaring past?",o:["Bij weinig licht werken alleen de staafjes, en die zien alleen grijstinten","Bij weinig licht werken alleen de kegeltjes, en die zien alleen grijstinten","De pupil wordt nauw, waardoor kleur wordt tegengehouden","De gele vlek werkt niet bij weinig licht, de blinde vlek wel"],a:0,

{t:"netvlies",k:"Grafiek aflezen",q:"De pijl wijst naar de diepblauwe lucht van de Caféterras (neem 460 nm). Welke combinatie past?",fig:{img:"cafeterras",arrow:[70,10]},o:["Blauw ±90%, groen ±20%, rood 0%","Blauw 100%, groen 0%, rood 0%","Blauw ±40%, groen ±80%, rood ±30%","Rood ±90%, groen ±20%, blauw 0%"],a:0,
e:"Bij 460 nm snijdt de verticale lijn de blauwe curve rond 90% en de groene rond 20%. De rode curve begint pas rond 480 nm.",
x:["","Blauw 100% en de rest 0% hoort bij ongeveer 430-440 nm (violetblauw).","Dit hoort bij ongeveer 500 nm: blauwgroen.","Je hebt de rode en blauwe curve verwisseld."]},
{t:"netvlies",k:"Grafiek aflezen",q:"Bij welke golflengte zijn de blauwe en groene kegeltjes ongeveer even sterk actief?",fig:{cones:true},o:["Ongeveer 485 nm","Ongeveer 430 nm","Ongeveer 535 nm","Ongeveer 610 nm"],a:0,
e:"De blauwe en groene curve snijden elkaar rond 485 nm: beide ongeveer 60%.",
x:["","Bij 430 nm is blauw bijna 100% en groen 0%.","Bij 535 nm is groen 100% en blauw bijna 0%.","Bij 610 nm zijn alleen rood en een beetje groen actief."]},
{t:"netvlies",k:"Kegeltjes",q:"Welk type kegeltje is het gevoeligst bij 535 nm?",o:["M (groen)","S (blauw)","L (rood)","Alle drie even gevoelig"],a:0,
e:"De M-kegeltjes (middle wavelength) hebben hun maximum bij ongeveer 535 nm.",

{t:"netvlies",k:"Figuur 26",q:"Bekijk de schematische grafiek (naar figuur 26 van de module). Waar is de dichtheid van de staafjes het grootst?",fig:{svg:"dichtheid"},o:["Ongeveer 20 graden naast de gele vlek","Precies op de gele vlek","Op de blinde vlek","Helemaal aan de rand (70 graden)"],a:0,
e:"Op de gele vlek zitten geen staafjes. Naar buiten toe stijgt hun aantal tot een maximum rond 20 graden, daarna daalt het weer langzaam.",
x:["","Op de gele vlek zitten alleen kegeltjes.","Op de blinde vlek zitten geen zintuigcellen.","Aan de rand zijn er wel staafjes, maar minder dan rond 20 graden."]},
{t:"netvlies",k:"Wit zien",q:"Wanneer neem je wit licht waar?",o:["Als de drie typen kegeltjes evenveel geactiveerd worden","Als alleen de staafjes actief zijn","Als geen enkel kegeltje actief is","Als alleen de rode en groene kegeltjes actief zijn"],a:0,
e:"De kleur hangt af van de verhouding tussen de activatie van S, M en L. Alle drie evenveel betekent wit.",
x:["","Met alleen staafjes zie je grijstinten, geen wit licht als kleur.","Geen enkel kegeltje actief: dan zie je zwart.","Rood en groen samen geeft geel."]},

{t:"netvlies",k:"Opdracht 4b",q:"Bij welke golflengte is het blauwe kegeltje (S) volgens figuur 22 het meest lichtgevoelig?",fig:{cones:true},o:["Ongeveer 430 nm","Ongeveer 535 nm","Ongeveer 575 nm","Ongeveer 610 nm"],a:0,
e:"Onder figuur 22 staat bij de top van de blauwe curve 430 nm. De top ligt in de tekening net iets rechts van 430.",

{t:"netvlies",k:"Meerdere kegeltjes",q:"Bij welke kleur is maar één soort kegeltje actief?",fig:{cones:true},o:["Dieprood (ongeveer 660 nm)","Geel (ongeveer 580 nm)","Oranje (ongeveer 610 nm)","Groen (ongeveer 520 nm)"],a:0,
e:"Vanaf ongeveer 640 nm is alleen de rode curve (L) nog boven 0. Bij dieprood is dus alleen het rode kegeltje actief.",
